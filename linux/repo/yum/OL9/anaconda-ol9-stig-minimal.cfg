# --- drop-in 90: Password Safe onboarding ------------------------------------
# Numbered 90 so the asset is created after AD Bridge work has had its chance.
# Moved out of %post so that (a) the API key lives in /etc/first-boot, which the
# runner deletes after it completes, instead of being baked into a permanent
# script and echoed into /root/ks-post.log, and (b) `ip addr` reads the booted
# host's interfaces rather than the installer's.
cat > /etc/first-boot/pws-keys.conf <<'PWSKEYEOF'
# Variables for Password Safe onboarding. Deleted by custom-first-boot.sh.
APIUSER="python-join"
APIKEY="0699e51638fd1c7090f49fcf6ea58e171c06ca074bb4f631a02a532bb0fb61b808c04591a0c3f6350fcfeb1f3634c5ad99dd29227561e5d7b72c5be2b1ce2470"
PWSKEYEOF
chmod 0600 /etc/first-boot/pws-keys.conf

cat > /usr/local/sbin/first-boot.d/90-pws-onboard <<'PWSEOF'
#!/bin/sh
# Password Safe onboarding - runs at first boot via custom-first-boot.sh.
# Cf. phil-hands-off-debian classes/beyondtrust/pws/files/pws-assetcreate
KEYFILE=/etc/first-boot/pws-keys.conf
if [ ! -r "$KEYFILE" ]; then
  echo "ERROR: $KEYFILE missing"; logger -p local0.error "pws-onboard: $KEYFILE missing"; exit 9
fi
. "$KEYFILE"
if [ -z "$APIKEY" ] || [ -z "$APIUSER" ]; then
  echo "ERROR: No APIKEY or APIUSER in $KEYFILE"
  logger -p local0.error "pws-onboard: no APIKEY/APIUSER in $KEYFILE"
  exit 9
fi

ipaddress=`ip addr show dev ens160 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
if [ -z "$ipaddress" ]; then
  ipaddress=`ip addr show dev enp0s31f6 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
fi
if [ -z "$ipaddress" ]; then
  ipaddress=`ip addr show dev ens192 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
fi
if [ -z "$ipaddress" ]; then
  ipaddress=1.1.1.1
fi

python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net  -t asset -a create --workgroup 6 --system `hostname` --macaddress 17:15:AB:AD:1D:EA --ipaddress $ipaddress --dnsname `hostname -f` --operatingsystem "Oracle Linux 9"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname` --workgroup BEYONDTRUST --attribute "Linux" --attributetype "OS Type"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname` --workgroup BEYONDTRUST --attribute "Unix" --attributetype "System Class"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname` --workgroup BEYONDTRUST --attribute "Online" --attributetype "System Availability"
# Sleep to allow the smartrules to trigger and add the system as a managed system before adding MA
sleep 30
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net -t ma -a create --system `hostname` --workgroup 6 --account badmin --automanagementflag true --passwordruleid 3 -D
# blindly create assets. If this fails, Retina will pick them up later
exit 0
PWSEOF
chmod 0700 /usr/local/sbin/first-boot.d/90-pws-onboard

# --- post-build evidence -----------------------------------------------------
# /root/stig-layout.txt is written at FIRST BOOT by first-boot.d/05-baseline-capture,
# not here - `lsblk` in %post reports the installer's view, not the booted layout.
# The only thing worth recording from inside %post is the fstab that was written.
cp /etc/fstab /root/anaconda-written-fstab.txt

%end
