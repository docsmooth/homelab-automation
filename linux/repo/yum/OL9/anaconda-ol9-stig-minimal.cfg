### Oracle Linux 9 kickstart - STIG-supported disk layout (MINIMAL variant)
###
### Derived from: anaconda-ol9.cfg (working OL9 lab build)
### Change scope: disk partitioning + fstab mount options ONLY.
###               No OpenSCAP remediation, no firewall/SELinux policy changes.
###
### Baseline: DISA Oracle Linux 9 STIG V1R6 (published 2026-05-14).
###   Filesystem/mount rule set is byte-identical to V1R4 (05 Jan 2026).
###   Source (mirror, Tier 3 - verify against https://public.cyber.mil/stigs/downloads/):
###   https://cyber.trackr.live/stig/Oracle_Linux_9/1/6
###
### Separate-filesystem rules implemented:
###   OL09-00-000002 / V-271432  separate FS for the system audit data path (/var/log/audit)
###   OL09-00-000003 / V-271433  separate FS for user home directories (/home)
###   OL09-00-000004 / V-271434  separate FS for /tmp
###   OL09-00-000005 / V-271435  separate FS for /var
###   OL09-00-000006 / V-271436  separate FS for /var/log
###   OL09-00-000007 / V-271437  separate FS for /var/tmp
###   NOTE: the OL9 STIG does NOT mandate a separate /boot, but OL09-00-002030 (nodev)
###         and OL09-00-002031 (nosuid) on /boot are only enforceable if it is separate.
###
### Mount-option rules implemented:
###   OL09-00-002030 / V-271647  /boot            nodev
###   OL09-00-002031 / V-271648  /boot            nosuid
###   OL09-00-002032 / V-271649  /boot/efi        nosuid  (UEFI only - set in %post)
###   OL09-00-002040/1/2 V-271650/1/2  /dev/shm   nodev,noexec,nosuid  (set in %post - tmpfs)
###   OL09-00-002050/1/2 V-271653/4/5  /tmp       nodev,noexec,nosuid
###   OL09-00-002060 / V-271656  /var             nodev
###   OL09-00-002061/2/3 V-271657/8/9  /var/log   nodev,noexec,nosuid
###   OL09-00-002064/5/6 V-271660/1/2  /var/log/audit nodev,noexec,nosuid
###   OL09-00-002067/8/9 V-271663/4/5  /var/tmp   nodev,noexec,nosuid
###   OL09-00-002070 / V-271666  /home            nodev
###   OL09-00-002071 / V-271667  /home            nosuid
###   OL09-00-002072 / V-271668  /home            noexec
###   OL09-00-002080 / V-271669  nodev on all nonroot local partitions
###
### KNOWN, DELIBERATE DEVIATIONS:
###   OL09-00-000001 / V-271431 (at-rest encryption / crypttab) - not implemented,
###     unattended lab rebuild has nowhere to hold a LUKS passphrase. Stanza commented below.
###   OL09-00-000850 / V-271596 - "one week's worth of audit records", advisory ~10 GB
###     for /var/log/audit. At 13% of the VG that is only met on disks >= ~80 GB.
###
### BEHAVIOUR CHANGE vs the original file: clearpart was "--none", which cannot work
### with an explicit partition scheme on a disk that already has partitions.
### It is now "--all --initlabel" plus zerombr. This WILL wipe sda on every build.

