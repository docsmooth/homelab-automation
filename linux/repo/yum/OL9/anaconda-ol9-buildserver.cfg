cat > /usr/local/sbin/first-boot.d/90-pws-onboard <<'PWSEOF'
#!/bin/sh
# Password Safe onboarding - runs at first boot via custom-first-boot.sh.
# Cf. phil-hands-off-debian classes/beyondtrust/pws/files/pws-assetcreate
KEYFILE=/etc/first-boot/pws-keys.conf
if [ ! -r "$KEYFILE" ]; then
  echo "ERROR: $KEYFILE missing"; logger -p local0.error "pws-onboard: $KEYFILE missing"; exit 9
fi
. "$KEYFILE"
if [ -z "$APIKEY" ] || [ -z "$APIUSER" ]; then
  echo "ERROR: No APIKEY or APIUSER in $KEYFILE"
  logger -p local0.error "pws-onboard: no APIKEY/APIUSER in $KEYFILE"
  exit 9
fi

# Ask the routing table which address this host actually uses, rather than
# guessing at NIC names. The named-interface chain is the fallback for a host
# with no default route at first boot.
ipaddress=`ip -4 route get 1.1.1.1 2>/dev/null | awk '{ for(i=1;i<=NF;i++) if($i=="src") { print $(i+1); exit } }'`
for dev in ens160 enp0s31f6 ens192; do
  [ -n "$ipaddress" ] && break
  ipaddress=`ip addr show dev $dev 2>/dev/null | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
done
if [ -z "$ipaddress" ]; then
  ipaddress=1.1.1.1
fi

# Probe for the CA bundle rather than hardcoding one. A -C path that does not
# exist is FATAL in pbpsapi.py and reports "ERROR<tab>main<tab>No data!" - the
# same message as every other failure - so a wrong path here is indistinguishable
# from a real API error. Order: RHEL plain PEM, RHEL direct, RHEL trusted format,
# Debian (this block is shared with phil-hands-off-debian pws-assetcreate).
for c in /etc/ssl/certs/ca-bundle.crt /etc/pki/tls/certs/ca-bundle.crt \
         /etc/ssl/certs/ca-bundle.trust.crt /etc/ssl/certs/ca-certificates.crt ; do
  [ -r "$c" ] && CABUNDLE="$c" && break
done
if [ -z "$CABUNDLE" ]; then
  echo "ERROR: no readable CA bundle found for pbpsapi.py"
  logger -p local0.error "pws-onboard: no readable CA bundle found"
  exit 9
fi

# --no-multiple is REQUIRED here. pbpsapi.py treats a non-tty stdin as bulk
# pipeline input; custom-first-boot.service hands every drop-in /dev/null on
# stdin, so it read an empty header line, did zero work and exited 64 with
# "ERROR<tab>main<tab>No data!". See "pbpsapi.py --examples".
PBPS="python3 /root/pbpsapi.py --no-multiple -k $APIKEY -u $APIUSER -C $CABUNDLE -s pbps.totalnetsolutions.net"

# Every Password Safe call goes through pws() so a failure is recorded instead of
# scrolling past in the journal. These calls are deliberately non-fatal (see the
# exit 0 below), which is exactly why a silent one can go unnoticed for months.
FAILLOG=/root/pws-onboard-FAILED.txt
pwsfailed=
pws() {
  if $PBPS "$@"; then
    return 0
  fi
  logger -p local0.error "pws-onboard: FAILED: pbpsapi.py $*"
  echo "FAILED: pbpsapi.py $*" >> "$FAILLOG"
  pwsfailed=1
}

pws -t asset -a create --workgroup 6 --system `hostname -s` --macaddress 17:15:AB:AD:1D:EA --ipaddress $ipaddress --dnsname `hostname -f` --operatingsystem "Oracle Linux 9"
pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Linux" --attributetype "OS Type"
pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Unix" --attributetype "System Class"
pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Online" --attributetype "System Availability"
# Sleep to allow the smartrules to trigger and add the system as a managed system before adding MA
sleep 30
pws -t ma -a create --system `hostname -s` --workgroup 6 --account badmin --automanagementflag true --passwordruleid 3 -D

if [ -n "$pwsfailed" ]; then
  logger -p local0.error "pws-onboard: some Password Safe calls failed - see $FAILLOG. custom-first-boot.sh deletes /etc/first-boot at the end of this boot, so the API key is gone and these CANNOT be retried on this host: rebuild it."
fi
# blindly create assets. If this fails, Retina will pick them up later, so exit 0
# even on failure rather than failing custom-first-boot.service.
exit 0
PWSEOF
chmod 0700 /usr/local/sbin/first-boot.d/90-pws-onboard

# --- build crib sheet --------------------------------------------------------
cat > /opt/builder/BUILDING.md <<'CRIBEOF'
# ADBridge on this host

Source of truth: adbridge.git `src/linux/README.md`. This is the host-specific part.

## Layout
    /opt/builder/src      clone adbridge here
    /opt/builder/build    build directory (keep ONE per checked-out source)
    /builder/third-party  prebuilt libs, NFS, read-only

Installed with `autopart --nohome`, so / absorbs the disk and /opt/builder is
where the space is. There is no STIG hardening on this host - /tmp, /var/tmp
and /home are all normal, exec-capable mounts. (The stig-minimal / stig-full
profiles in the same directory mount those noexec, which breaks autoconf and
libtool; if you ever rebuild this box from one of those, read their headers.)

## Build
    git clone git@github.com:BeyondTrust/adbridge.git /opt/builder/src/adbridge
    mkdir -p /opt/builder/build && cd /opt/builder/build
    /opt/builder/src/adbridge/src/linux/configure --build-isas=x86_64
    make -j$(nproc) all sfx

`--build-isas=x86_64` is not optional shorthand here: no 32-bit devel packages
are installed, and EL10 / Alma 10 are 64-bit only. Without it, configure fails
with "[lwbase] ERROR: could not determine endianness".

## What this host produces
One x86_64 RPM set for the whole EL family. The build system keys third-party
artifacts on distro ARCHETYPE, not version (`src/linux/openssl/MakeKitBuild:13`),
and OL9 resolves to archetype `redhat`, so there is no separate OL10 or Alma10
build path to run.

Built against glibc 2.34, so the output runs on EL9 and everything newer,
including OL10 and Alma 10. It will NOT run on EL7 or EL8.

If you ever need a genuinely EL10-native rpmbuild rather than an OL9-built RPM
that merely installs on EL10, `mock -r alma+epel-10-x86_64` is installed. The
tree does not use mock; that is a manual path.

## What this host does NOT produce
- `.deb` - needs dpkg-buildpackage/fakeroot/debhelper and archetype `debian`
  (`package-deb.sh:70`). Separate Debian/Ubuntu host.
- aarch64, s390x, ppc64le - native architecture required; there is no
  cross-compile configuration in the tree.
- AIX / Solaris / HP-UX / macOS.

## Do not install your own output here
`pbis-enterprise-fips` is installed from the repo. `rpm -Uvh` of a freshly
built package would clobber the running agent, and the package under test would
no longer be going onto a clean system. Use a throwaway VM or a container.

## Verification
`/root/build-env-check.txt` is written at first boot. If
`/root/BUILD-ENV-PROBLEMS` exists, read it before you start debugging a build.
CRIBEOF
chown 15100:15100 /opt/builder/BUILDING.md

%end
