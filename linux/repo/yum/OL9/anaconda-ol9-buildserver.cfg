# =============================================================================
# first-boot framework: ONE service, many drop-in scripts
# =============================================================================
# Carried over from the stig-* builds; ported there from phil-hands-off-debian,
# preseed/classes/setup/first-boot:
#   /usr/local/sbin/custom-first-boot.sh   runner; executes /usr/local/sbin/first-boot.d/*
#   /usr/local/sbin/first-boot.d/          numbered drop-ins, run in glob order
#   /etc/first-boot/                       secrets, deleted once the runner finishes
#
# Two things this buys over doing the work inline in %post, which is why it is
# worth keeping in the simple deploy: the Password Safe API key lives in
# /etc/first-boot and is deleted after the run instead of being echoed into
# /root/ks-post.log, and `ip addr` reads the booted host's interfaces rather
# than the installer's.
#
# The unit renames the runner to .done via ExecStartPost, so it cannot run
# twice. ExecStartPost only fires when ExecStart succeeded, so a failed drop-in
# leaves the runner in place and the unit failed - visible in
# `systemctl --failed` - and it retries next boot. That is deliberate.
mkdir -p /usr/local/sbin/first-boot.d /etc/first-boot
chmod 0700 /etc/first-boot

cat > /usr/local/sbin/custom-first-boot.sh <<'CFBEOF'
#!/bin/sh
# Runner for /usr/local/sbin/first-boot.d/*.
# Ported from phil-hands-off-debian
# preseed/classes/setup/first-boot/files/custom-first-boot.sh
exitcode=0

for script in /usr/local/sbin/first-boot.d/* ; do
  [ -x "$script" ] || continue
  logger -p local0.info "Running first boot $script"
  if "$script"; then
    logger -p local0.info "first boot OK: $script"
  else
    logger -p local0.error "first boot script FAILED: $script"
    echo "$script" >> /root/first-boot-FAILED.txt
    exitcode=9
  fi
done

# DECISION, stated rather than inherited from a bug: secrets staged for first boot
# are removed whether or not a drop-in failed. Leaving them on a long-running host
# is worse than losing them. The cost is that a secret-dependent drop-in CANNOT be
# retried after a failure - the host has to be rebuilt - so the failure has to be
# loud. Hence the breadcrumb file above and the explicit message below.
if [ -d /etc/first-boot ]; then
  logger -p local0.info "Deleting data in /etc/first-boot"
  rm -Rf /etc/first-boot
fi
if [ "$exitcode" -ne 0 ]; then
  logger -p local0.warning "one or more first-boot scripts failed - see /root/first-boot-FAILED.txt. /etc/first-boot was deleted regardless, so any secret-dependent script cannot be retried: rebuild the host."
fi

exit $exitcode
CFBEOF
chmod 0700 /usr/local/sbin/custom-first-boot.sh

cat > /etc/systemd/system/custom-first-boot.service <<'CFBUEOF'
[Unit]
Description=Run first boot script
ConditionPathExists=/usr/local/sbin/custom-first-boot.sh
Wants=network-online.target
After=network-online.target
After=sshd.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/custom-first-boot.sh
ExecStartPost=/usr/bin/mv /usr/local/sbin/custom-first-boot.sh /usr/local/sbin/custom-first-boot.done

[Install]
WantedBy=multi-user.target
CFBUEOF

mkdir -p /etc/systemd/system/multi-user.target.wants
ln -sf /etc/systemd/system/custom-first-boot.service \
       /etc/systemd/system/multi-user.target.wants/custom-first-boot.service

# --- drop-in 50: build environment verification -------------------------------
# Runs on the BOOTED system, not in %post. Anaconda's %post is chrooted into the
# target but runs under the INSTALLER kernel and mount table, so `findmnt`,
# `lsblk` and `df` executed there describe the installer, not this host - and
# the NFS shares do not exist yet.
cat > /usr/local/sbin/first-boot.d/50-build-env-verify <<'BEVEOF'
#!/bin/sh
# ADBridge build server self-check. Cf. adbridge.git src/linux/README.md.
set -u
OUT=/root/build-env-check.txt
FAIL=0
{
  echo "=== captured $(date -u +%Y-%m-%dT%H:%M:%SZ) on $(hostname -f 2>/dev/null || hostname) ==="
  echo
  echo "--- release / toolchain ---"
  cat /etc/os-release
  cat /etc/redhat-release 2>/dev/null
  uname -r
  gcc --version | head -1
  ld --version | head -1
  rpmbuild --version
  echo
  echo "--- distro archetype the build system will pick ---"
  echo "platform.sh reads /etc/redhat-release first; 'Red Hat Enterprise Linux'"
  echo "=> MK_BUILD_DISTRO=rhel => MK_HOST_DISTRO_ARCHETYPE=redhat"
  echo "=> third-party artifacts resolve under .../prod/<lib>/linux/redhat/x86_64"
  echo
  echo "--- filesystem layout ---"
  lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT
  df -h / /opt /var /home 2>/dev/null
} > "$OUT" 2>&1

{
  echo
  echo "--- build space ---"
  # /opt is on / unless someone changed the partitioning. Warn early rather
  # than at 90% through a `make all sfx`.
  avail=$(df -BG --output=avail /opt 2>/dev/null | tail -1 | tr -dc '0-9')
  echo "/opt available: ${avail:-unknown} GB"
  if [ -n "${avail:-}" ] && [ "$avail" -lt 100 ]; then
    echo "WARN less than 100 GB free for builds"
  fi

  echo
  echo "--- third-party NFS shares ---"
  for d in adbridge-3rdparty prod prod_test staging src-release src-feature; do
    printf '%-22s ' "$d"
    if mountpoint -q "/builder/third-party/$d"; then echo mounted
    else echo "NOT MOUNTED"; FAIL=1; fi
  done

  echo
  echo "--- build prerequisites (README 'Required Software') ---"
  for b in gcc g++ make ld flex bison autoconf automake libtool rpmbuild expect git perl python3; do
    printf '%-12s ' "$b"; command -v "$b" || { echo MISSING; FAIL=1; }
  done

  echo
  echo "--- libpam development symlink ---"
  found=0
  for l in /usr/lib64/libpam.so /lib64/libpam.so; do
    [ -e "$l" ] && { echo "$l"; found=1; break; }
  done
  [ "$found" -eq 1 ] || { echo "MISSING - -lpam will fail to link"; FAIL=1; }
} >> "$OUT" 2>&1

if [ "$FAIL" -ne 0 ]; then
  cp "$OUT" /root/BUILD-ENV-PROBLEMS
  logger -p local0.error "build env check found problems; see /root/BUILD-ENV-PROBLEMS"
else
  rm -f /root/BUILD-ENV-PROBLEMS
fi

# Report only. An unmounted NFS share at first boot is usually a timing issue,
# and failing here would leave custom-first-boot.service permanently failed.
exit 0
BEVEOF
chmod 0700 /usr/local/sbin/first-boot.d/50-build-env-verify

