### Oracle Linux 9 kickstart - ADBridge BUILD SERVER
###
### Base: /net/prlxfsww02/repo/yum/OL9/anaconda-ol9.cfg (the plain deploy).
### No STIG hardening - that is only wanted on the test hosts.
###
### Carried over from the stig-* variants (the %post fixes worth keeping):
###   - the AppStream `repo` line, without which an unattended install stops
###     on a "missing packages" prompt
###   - the EPEL availability CHECK rather than assuming the release RPM took
###   - the first-boot framework (one service, numbered drop-ins), which gets
###     the Password Safe API key out of /root/ks-post.log and lets `ip addr`
###     read the booted host instead of the installer
###   - badmin as the Password Safe managed account instead of root
###
### Added for the build role:
###   - toolchain per adbridge.git src/linux/README.md
###   - autopart --nohome, so / absorbs the disk
###   - /builder/third-party NFS shares
###   - a first-boot build-environment self-check
###
### -----------------------------------------------------------------------------
### WHY OL9 FOR A HOST THAT BUILDS OL10 / ALMA 10 PACKAGES
### -----------------------------------------------------------------------------
### The ADBridge build system has no per-EL-version build path. Prebuilt
### third-party artifacts are keyed by distro ARCHETYPE, not version:
###   src/linux/openssl/MakeKitBuild:13
###     PBIS_OPENSSL_ARTIFACT="${MK_PREBUILT_DIST_DIR}/openssl/${MK_OS}/${MK_HOST_DISTRO_ARCHETYPE}/${MK_ISA}"
###   src/linux/makekit/mk/module/platform.sh:694  rhel|centos|redhat|fedora|amazon -> "redhat"
### Every EL target resolves to .../linux/redhat/x86_64, so one "redhat" x86_64
### host produces the RPM for all of them.
###
### Build on the OLDEST EL you must support, not the newest: binaries link
### against the build host's glibc and run forward, never backward. OL9 is
### glibc 2.34; OL10/Alma10 are 2.39+. OL9 output installs and runs on EL10.
### The reverse does not hold.
###
### On OL9 /etc/redhat-release reads "Red Hat Enterprise Linux release 9.x", so
### platform.sh:500 sets MK_BUILD_DISTRO=rhel -> archetype "redhat".
###
### KNOWN LIMIT: glibc 2.34 output will NOT run on EL7 (2.17) or EL8 (2.28).
### If ADBridge still ships EL7/EL8 RPMs, this is an ADDITIONAL builder for the
### EL9+ line, not a replacement for whatever builds the legacy line today.

