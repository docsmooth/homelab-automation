# install off any noexec mount point. Runbook section 5.
yum install -y pbis-enterprise-fips powerbroker-config_client_tns22
/opt/pbis/sbin/lwsmd --start-as-daemon
/opt/pbis/bin/lwsm autostart
fi
wget -O /root/pbpsapi.py http://build.totalnetsolutions.net/centos/pbpsapi.py
wget -O /etc/firewalld/services/pblocald.xml http://build.totalnetsolutions.net/centos/pbise/pblocald.xml

if [ "$LABREPRO" != "1" ]; then
hostname -f | grep -iq "child"
if [ $? -eq 0 ]; then
  wget -O /root/dj.conf http://build.totalnetsolutions.net/centos/pbise/djpbps.child1.lwtest.corp
  wget -O /usr/local/sbin/first-boot.d/20-adb-join http://build.totalnetsolutions.net/centos/pbise/firstjoin.child1.lwtest.corp
else
  hostname -f | grep -iq "lwtest"
  if [ $? -eq 0 ]; then
    wget -O /root/dj.conf http://build.totalnetsolutions.net/centos/pbise/djpbps.lwtest.corp
  wget -O /usr/local/sbin/first-boot.d/20-adb-join http://build.totalnetsolutions.net/centos/pbise/firstjoin.lwtest.corp
  fi
fi
hostname -f | grep -iq "1way"
if [ $? -eq 0 ]; then
  wget -O /root/dj.conf http://build.totalnetsolutions.net/centos/pbise/djpbps.1way.local
  wget -O /usr/local/sbin/first-boot.d/20-adb-join http://build.totalnetsolutions.net/centos/pbise/firstjoin.1way.local
fi
hostname -f | grep -iq "totalnet"
if [ $? -eq 0 ]; then
  wget -O /root/dj.conf http://build.totalnetsolutions.net/centos/pbise/djpbps.totalnetsolutions.net
  wget -O /usr/local/sbin/first-boot.d/20-adb-join http://build.totalnetsolutions.net/centos/pbise/firstjoin.totalnetsolutions.net
fi
chmod 0700 /usr/local/sbin/first-boot.d/20-adb-join 2>/dev/null || true
else
# LABREPRO=1: no firstjoin.<domain> drop-in is installed, so first boot runs only
# 05-baseline-capture and 90-pws-onboard. No domain join.
:
fi

# --- drop-in 90: Password Safe onboarding ------------------------------------
# Numbered 90 so it runs after 20-adb-join. Replaces the old approach of
# appending a heredoc onto /usr/local/sbin/custom-first-boot, which left the API
# key in a permanent on-disk script. The key now lives in /etc/first-boot, which
# custom-first-boot.sh deletes once it finishes.
cat > /etc/first-boot/pws-keys.conf <<'PWSKEYEOF'
# Variables for Password Safe onboarding. Deleted by custom-first-boot.sh.
APIUSER="python-join"
APIKEY="0699e51638fd1c7090f49fcf6ea58e171c06ca074bb4f631a02a532bb0fb61b808c04591a0c3f6350fcfeb1f3634c5ad99dd29227561e5d7b72c5be2b1ce2470"
PWSKEYEOF
chmod 0600 /etc/first-boot/pws-keys.conf

cat > /usr/local/sbin/first-boot.d/90-pws-onboard <<'PWSEOF'
#!/bin/sh
# Password Safe onboarding - runs at first boot via custom-first-boot.sh.
# Cf. phil-hands-off-debian classes/beyondtrust/pws/files/pws-assetcreate
KEYFILE=/etc/first-boot/pws-keys.conf
if [ ! -r "$KEYFILE" ]; then
  echo "ERROR: $KEYFILE missing"; logger -p local0.error "pws-onboard: $KEYFILE missing"; exit 9
fi
. "$KEYFILE"
if [ -z "$APIKEY" ] || [ -z "$APIUSER" ]; then
  echo "ERROR: No APIKEY or APIUSER in $KEYFILE"
  logger -p local0.error "pws-onboard: no APIKEY/APIUSER in $KEYFILE"
  exit 9
fi

systemctl enable dnf-automatic.timer
firewall-cmd --add-service pblocald --zone public --permanent 2>/dev/null || true
firewall-cmd --reload 2>/dev/null || true

ipaddress=`ip addr show dev ens160 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
if [ -z "$ipaddress" ]; then
  ipaddress=`ip addr show dev enp0s31f6 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
fi
if [ -z "$ipaddress" ]; then
  ipaddress=`ip addr show dev ens192 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
fi
if [ -z "$ipaddress" ]; then
  ipaddress=1.1.1.1
fi

# Join Status is only meaningful if AD Bridge is actually present and joined.
exitcode=0
if command -v pbis >/dev/null 2>&1 && pbis status >/dev/null 2>&1; then
    python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attributetype "Join Status" --attribute "AD Joined"
else
    logger -p local0.info "pws-onboard: AD Bridge not present or not joined (expected under LABREPRO=1)"
fi

python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net  -t asset -a create --workgroup 6 --system `hostname -s` --macaddress 17:15:AB:AD:1D:EA --ipaddress $ipaddress --dnsname `hostname -f` --operatingsystem "Alma Linux 10"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Linux" --attributetype "OS Type"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Unix" --attributetype "System Class"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Online" --attributetype "System Availability"
# Sleep to allow the smartrules to trigger and add the system as a managed system before adding MA
sleep 30
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net -t ms -a create --system `hostname -s` --workgroup 6 --automanagementflag true --passwordruleid 3 -D --platform 2
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.crt -s pbps.totalnetsolutions.net -t ma -a create --system `hostname -s` --workgroup 6 --account badmin --automanagementflag true --passwordruleid 3 -D --newpassword RobHome1
exit $exitcode
PWSEOF
chmod 0700 /usr/local/sbin/first-boot.d/90-pws-onboard

# --- post-build evidence -----------------------------------------------------
# /root/stig-layout.txt is written at FIRST BOOT by first-boot.d/05-baseline-capture,
# not here - `lsblk` in %post reports the installer's view, not the booted layout.
# The only thing worth recording from inside %post is the fstab that was written.
cp /etc/fstab /root/anaconda-written-fstab.txt

%end
