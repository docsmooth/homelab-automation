# --- SELinux tooling required by adbridge-selinux-lab-runbook.md --------------
# sections 3, 5, 6 and 7 use semodule, sestatus, getenforce, semanage,
# sesearch and audit2allow. A minimal EL10 install has none of the last three.
# Repo placement in EL10 (verify if the build tree only serves BaseOS):
#   setools-console               BaseOS     -> sesearch, seinfo, sediff
#   libselinux-utils              BaseOS     -> getenforce, setenforce, avcstat
#   policycoreutils               BaseOS     -> semodule, sestatus, restorecon
#   policycoreutils-python-utils  AppStream  -> audit2allow, audit2why, semanage
# audit2allow being AppStream matters: the published AD Bridge SELinux
# remediation procedure depends on it.
setools-console
libselinux-utils
policycoreutils
policycoreutils-python-utils

%end

# Run the Setup Agent on first boot
firstboot --disable


ignoredisk --only-use=sda

# --- STIG partition layout (replaces "autopart") -----------------------------
# reqpart creates whatever the platform demands (BIOS boot partition on GPT, or
# the EFI System Partition on UEFI), so this file works on BIOS and UEFI VMs.
# Ref: RHEL 10 kickstart commands and options reference, "reqpart"
# https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/10/html/automatically_installing_rhel/kickstart-commands-and-options-reference
zerombr
clearpart --all --initlabel
reqpart

# /boot at 2 GiB per the RHEL 10 recommended minimum (raised from 1 GiB in EL9).
# /boot cannot be an LVM volume.
part /boot --fstype=xfs --size=2048 --fsoptions="defaults,nodev,nosuid" --label=boot
part pv.01 --fstype=lvmpv --grow
volgroup vg_os pv.01

logvol swap            --vgname=vg_os --name=lv_swap      --fstype=swap --percent=8
logvol /               --vgname=vg_os --name=lv_root      --fstype=xfs  --percent=30 --fsoptions="defaults"
logvol /home           --vgname=vg_os --name=lv_home      --fstype=xfs  --percent=2  --fsoptions="defaults,nodev,nosuid,noexec"
logvol /tmp            --vgname=vg_os --name=lv_tmp       --fstype=xfs  --percent=9  --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var            --vgname=vg_os --name=lv_var       --fstype=xfs  --percent=18 --fsoptions="defaults,nodev"
logvol /var/log        --vgname=vg_os --name=lv_varlog    --fstype=xfs  --percent=13 --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var/log/audit  --vgname=vg_os --name=lv_varlogaud --fstype=xfs  --percent=13 --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var/tmp        --vgname=vg_os --name=lv_vartmp    --fstype=xfs  --percent=5  --fsoptions="defaults,nodev,nosuid,noexec"

# RHEL-10-000510 / V-280935 (CAT I) at-rest encryption. Enable only with
# Clevis/Tang or TPM2 escrow:
# part pv.01 --fstype=lvmpv --grow --encrypted --luks-version=luks2 --passphrase=CHANGEME

# `bootloader` is a required command in RHEL 10. --boot-drive rather than
# --location keeps this working on both BIOS and UEFI.
bootloader --boot-drive=sda
# -----------------------------------------------------------------------------

timesource --ntp-server=prwndcns01.totalnetsolutions.net
timesource --ntp-server=time-b-g.nist.gov
timesource --ntp-server=clock.xmission.com
# System timezone
timezone America/Chicago --utc

# --- badmin: Password Safe MANAGED account ------------------------------------
# badmin:x:15000:15000:Backup Admin:/home/badmin:/bin/bash
#
# Initial credential: SHA-512 ($6$), matching the OL8/OL9 lab builds so badmin
# has one password across every host. EL10 defaults to yescrypt ($y$) for new
# passwords, but libxcrypt 4.4.x on EL10 still verifies sha512crypt, so a $6$
# hash here is fine. Password Safe rotates badmin at onboarding, using
# pass-reset as the functional account.
#
# NOTE - /home/badmin is on the /home logical volume, which is mounted noexec
# (RHEL-10-400365). A Backup Admin cannot run scripts or binaries out of its own
# home directory. Put anything executable in /opt or /usr/local/bin.
#
# NOTE - if /home is automounted here, the local /home/badmin created at install
# is shadowed once autofs mounts over /home. Verify with `findmnt /home`.
group --name badmin --gid 15000
user --name badmin --uid 15000 --gid 15000 --gecos "Backup Admin" --homedir /home/badmin --shell /bin/bash --iscrypted --password=$6$080GomxHfXlHvhnH$vHnja/fPEOwNWjzjS9BxgyUwJyAOZ96HMLj7VF08KyiqyPvN9XI9GvTpEZu9uBLT15vDHzeFVEDDpf3oA5KhJ1

# --- pass-reset: Password Safe FUNCTIONAL account -----------------------------
# Deliberately homed at /opt/pass-reset, NOT under the automounted (and noexec)
# /home. Password Safe authenticates as this account to rotate badmin.
# local passwordsafe user
group --name sysadmin --gid 10001
user --homedir /opt/pass-reset --name pass-reset --iscrypted --shell /bin/bash --uid 10066 --gecos "PasswordSafe" --password $y$j9T$2lFT6DvvQOLKMicZf/Kx00$wc5wc8WWdXL/A1OlkUCDSeD324JXTsmIX0t0OlIomS0 --groups sysadmin
sshkey --username pass-reset "ssh-rsa  PBPS Root Cert for Linode"
sshkey --username pass-reset "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQC54dkBgC4PhipcbkzC+gCr3GFt2PdVY7N/y8/hFmMCh4MhKQCCjUJZrrbryzqeR0m4xLJIpss/mZZyJDKq1lwfF/vk4Tw/M+jlRplUZaHg9orLq4cRGAp9Qp7g59bsFpwH/wZXb+9JfxZg9hA/DSCTIlhAAPZc+cPIEmAUaR3y1w== rob@l-7k0s2z2"


# Root password
rootpw --iscrypted --allow-ssh $6$ajLe9SmfLY7wsNbz$sKSevm/n/4lUb4Ow.XQ69ljdEfS0pryl/s6r13jKQsnTd3GyzMoK3YDU6kE51SAduxtrR0Qa61V8LnPaNd3wu0

reboot --eject
%pre --log=/tmp/ks-pre.log
#!/bin/sh
SERVERNAME="lblxapxx-template.child1.lwtest.corp"

for x in `cat /proc/cmdline`; do
    case $x in SERVERNAME*)
        eval $x
        ;;
