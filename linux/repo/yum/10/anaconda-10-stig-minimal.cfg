# --- drop-in 90: Password Safe onboarding ------------------------------------
# Numbered 90 so it runs after 20-adb-join. Replaces the old approach of
# appending a heredoc onto /usr/local/sbin/custom-first-boot, which left the API
# key in a permanent on-disk script. The key now lives in /etc/first-boot, which
# custom-first-boot.sh deletes once it finishes.
cat > /etc/first-boot/pws-keys.conf <<'PWSKEYEOF'
# Variables for Password Safe onboarding. Deleted by custom-first-boot.sh.
APIUSER="python-join"
APIKEY="0699e51638fd1c7090f49fcf6ea58e171c06ca074bb4f631a02a532bb0fb61b808c04591a0c3f6350fcfeb1f3634c5ad99dd29227561e5d7b72c5be2b1ce2470"
PWSKEYEOF
chmod 0600 /etc/first-boot/pws-keys.conf

cat > /usr/local/sbin/first-boot.d/90-pws-onboard <<'PWSEOF'
#!/bin/sh
# Password Safe onboarding - runs at first boot via custom-first-boot.sh.
# Cf. phil-hands-off-debian classes/beyondtrust/pws/files/pws-assetcreate
KEYFILE=/etc/first-boot/pws-keys.conf
if [ ! -r "$KEYFILE" ]; then
  echo "ERROR: $KEYFILE missing"; logger -p local0.error "pws-onboard: $KEYFILE missing"; exit 9
fi
. "$KEYFILE"
if [ -z "$APIKEY" ] || [ -z "$APIUSER" ]; then
  echo "ERROR: No APIKEY or APIUSER in $KEYFILE"
  logger -p local0.error "pws-onboard: no APIKEY/APIUSER in $KEYFILE"
  exit 9
fi

systemctl enable dnf-automatic.timer
firewall-cmd --add-service pblocald --zone public --permanent 2>/dev/null || true
firewall-cmd --reload 2>/dev/null || true

ipaddress=`ip addr show dev ens160 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
if [ -z "$ipaddress" ]; then
  ipaddress=`ip addr show dev enp0s31f6 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
fi
if [ -z "$ipaddress" ]; then
  ipaddress=`ip addr show dev ens192 | awk '/inet / { print $2; exit }' | awk -F/ '{ print $1 }'`
fi
if [ -z "$ipaddress" ]; then
  ipaddress=1.1.1.1
fi

# Probe for the CA bundle rather than hardcoding one. A -C path that does not
# exist is FATAL in pbpsapi.py and reports "ERROR<tab>main<tab>No data!" - the
# same message as every other failure - so a wrong path here is indistinguishable
# from a real API error. Order: RHEL plain PEM, RHEL direct, RHEL trusted format,
# Debian (this block is shared with phil-hands-off-debian pws-assetcreate).
for c in /etc/ssl/certs/ca-bundle.crt /etc/pki/tls/certs/ca-bundle.crt \
         /etc/ssl/certs/ca-bundle.trust.crt /etc/ssl/certs/ca-certificates.crt ; do
  [ -r "$c" ] && CABUNDLE="$c" && break
done
if [ -z "$CABUNDLE" ]; then
  echo "ERROR: no readable CA bundle found for pbpsapi.py"
  logger -p local0.error "pws-onboard: no readable CA bundle found"
  exit 9
fi

# --no-multiple is REQUIRED here. pbpsapi.py treats a non-tty stdin as bulk
# pipeline input; custom-first-boot.service hands every drop-in /dev/null on
# stdin, so it read an empty header line, did zero work and exited 64 with
# "ERROR<tab>main<tab>No data!". See "pbpsapi.py --examples".
PBPS="python3 /root/pbpsapi.py --no-multiple -k $APIKEY -u $APIUSER -C $CABUNDLE -s pbps.totalnetsolutions.net"

# Every Password Safe call goes through pws() so a failure is recorded instead of
# scrolling past in the journal. These calls are deliberately non-fatal (see the
# exit 0 below), which is exactly why a silent one can go unnoticed for months.
FAILLOG=/root/pws-onboard-FAILED.txt
pwsfailed=
pws() {
  if $PBPS "$@"; then
    return 0
  fi
  logger -p local0.error "pws-onboard: FAILED: pbpsapi.py $*"
  echo "FAILED: pbpsapi.py $*" >> "$FAILLOG"
  pwsfailed=1
}

pws -t asset -a create --workgroup 6 --system `hostname -s` --macaddress 17:15:AB:AD:1D:EA --ipaddress $ipaddress --dnsname `hostname -f` --operatingsystem "Alma Linux 10"
pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Linux" --attributetype "OS Type"
pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Unix" --attributetype "System Class"
pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attribute "Online" --attributetype "System Availability"
# Join Status is only meaningful if AD Bridge is actually present and joined, and
# it can only be set once the asset above exists - so it runs after the create.
if command -v pbis >/dev/null 2>&1 && pbis status >/dev/null 2>&1; then
    pws -t attribute -a addToAsset --system `hostname -s` --workgroup BEYONDTRUST --attributetype "Join Status" --attribute "AD Joined"
else
    logger -p local0.info "pws-onboard: AD Bridge not present or not joined (expected under LABREPRO=1)"
fi
# Sleep to allow the smartrules to trigger and add the system as a managed system before adding MA
sleep 30
pws -t ms -a create --system `hostname -s` --workgroup 6 --automanagementflag true --passwordruleid 3 -D --platform 2
pws -t ma -a create --system `hostname -s` --workgroup 6 --account badmin --automanagementflag true --passwordruleid 3 -D --newpassword RobHome1

if [ -n "$pwsfailed" ]; then
  logger -p local0.error "pws-onboard: some Password Safe calls failed - see $FAILLOG. custom-first-boot.sh deletes /etc/first-boot at the end of this boot, so the API key is gone and these CANNOT be retried on this host: rebuild it."
fi
# Exit 0 even on failure: onboarding is best-effort and must not fail
# custom-first-boot.service (that would leave the runner un-renamed and re-running
# every boot). Retina picks the asset up on its next scan.
exit 0
PWSEOF
chmod 0700 /usr/local/sbin/first-boot.d/90-pws-onboard

# --- post-build evidence -----------------------------------------------------
# /root/stig-layout.txt is written at FIRST BOOT by first-boot.d/05-baseline-capture,
# not here - `lsblk` in %post reports the installer's view, not the booted layout.
# The only thing worth recording from inside %post is the fstab that was written.
cp /etc/fstab /root/anaconda-written-fstab.txt

%end
