### AlmaLinux 10 kickstart - STIG-supported disk layout (MINIMAL variant)
###
### Derived from: anaconda-10.cfg (working Alma 10 lab build)
### Change scope: disk partitioning + fstab mount options, badmin account,
###               SELinux tooling, LABREPRO gate. No OpenSCAP remediation.
###
### BASELINE - READ THIS BEFORE CITING ANYTHING FROM THIS FILE
### There is NO DISA STIG for AlmaLinux 10. DISA publishes an AlmaLinux OS 9 STIG
### (filed under "Cloud Linux", rule prefix ALMA-09-xxxxxx) but nothing for 10.
### AlmaLinux's scap-security-guide package builds its almalinux10 product by
### copying products/rhel10 and sed-rebranding the strings - see
### https://git.almalinux.org/rpms/scap-security-guide/raw/branch/a10/add-almalinux10-support.sh
### So the rules below are cited against the DISA Red Hat Enterprise Linux 10
### STIG V1R2 (published 2026-05-14), which is what that content actually is.
### Do not represent an AlmaLinux 10 scan result as DISA-authoritative.
###   RHEL 10 STIG V1R2: https://cyber.trackr.live/stig/Red_Hat_Enterprise_Linux_10/1/2
###   Verify against:    https://public.cyber.mil/stigs/downloads/
###
### Separate-filesystem rules implemented:
###   RHEL-10-000520 / V-280936  separate FS for the system audit data path (/var/log/audit)
###   RHEL-10-000530 / V-280937  separate FS for user home directories (/home)
###   RHEL-10-000540 / V-280938  separate FS for /tmp
###   RHEL-10-000550 / V-280939  separate FS for /var
###   RHEL-10-000560 / V-280940  separate FS for /var/log
###   RHEL-10-000570 / V-280941  separate FS for /var/tmp
###   NOTE: RHEL 10 has no separate-FS rule for /boot. It is created here because
###         RHEL-10-700120 (nodev) and RHEL-10-700125 (nosuid) on /boot are only
###         enforceable if /boot is its own filesystem.
###
### Mount-option rules implemented:
###   RHEL-10-700120 / V-281232  /boot            nodev
###   RHEL-10-700125 / V-281233  /boot            nosuid
###   RHEL-10-700130 / V-281234  /boot/efi        nosuid   (UEFI only - set in %post)
###   RHEL-10-700135/40/45  V-281235/6/7  /dev/shm  nodev,noexec,nosuid  (%post - tmpfs)
###   RHEL-10-700150/55/60  V-281238/9/40 /tmp      nodev,noexec,nosuid
###   RHEL-10-700165 / V-281241  /var             nodev ONLY - RHEL 10 has no
###                                               noexec or nosuid rule for /var
###   RHEL-10-700170/75/80  V-281242/3/4  /var/log  nodev,noexec,nosuid
###   RHEL-10-400400/05/10  V-281091/2/3  /var/log/audit nodev,noexec,nosuid
###   RHEL-10-700185/90/95  V-281245/6/7  /var/tmp  nodev,noexec,nosuid
###   RHEL-10-400355 / V-281088  /home            nodev
###   RHEL-10-400360 / V-281089  /home            nosuid
###   RHEL-10-400365 / V-281090  /home            noexec
###
### KNOWN, DELIBERATE DEVIATIONS:
###   RHEL-10-000510 / V-280935 (CAT I) - at-rest encryption on local disk
###     partitions. Not implemented: unattended lab rebuild has no passphrase
###     escrow. Commented stanza in the partition block below.
###   Audit storage capacity - see the sizing note in the runbook, section 2.4.
###
### EL10-SPECIFIC NOTES vs the OL8/OL9 files in this folder:
###   - /boot is 2048 MiB, not 1024. RHEL 10 raised the recommended minimum to
###     2 GiB ("If the /boot partition is too small, insufficient disk space can
###     cause future kernel updates to fail"). Ref: RHEL 10 kickstart reference.
###   - `bootloader` is a REQUIRED command in RHEL 10. Added below.
###   - `install` was removed as a kickstart command; this file does not use it.
###   - btrfs was removed as a valid --fstype. xfs remains the default.
###   - There is no installer Security Policy spoke on EL10: `%addon
###     com_redhat_oscap` was REMOVED in RHEL 10. Hardening must be post-install.
###
### *** FIPS REQUIRES A CHANGE OUTSIDE THIS FILE - READ BEFORE BUILDING ***
###   RHEL 10 REMOVED `fips-mode-setup`, and there is no `fips` kickstart
###   command and no FIPS %addon. Red Hat, Security hardening ch.1: "The only
###   correct way to switch the system to FIPS mode is to enable it during the
###   RHEL installation... Switching a system to FIPS mode after installation is
###   not supported in Red Hat Enterprise Linux 10. In particular, setting the
###   FIPS system-wide cryptographic policy is not sufficient to enable FIPS
###   mode." Turning it off later requires a full reinstall.
###
###   So `fips=1` MUST be on the INSTALLER's kernel command line - the PXE
###   append line or the ISO boot entry. A kickstart cannot put it there for
###   itself. What this file does do:
###     * `bootloader --append="fips=1"` so the INSTALLED system keeps it;
###     * adds `boot=UUID=<uuid of /boot>` in %post, required because /boot is a
###       separate partition;
###     * sets the FIPS:AD-SUPPORT subpolicy;
###     * installs first-boot.d/06-fips-verify, which checks
###       /proc/sys/crypto/fips_enabled and shouts if the installer was not
###       booted with fips=1.
###   None of that substitutes for the installer boot arg. If you build without
###   it you get a NON-FIPS host that merely looks configured, and the only fix
###   is a rebuild.
###
###   Also note: if the RHEL-10-000510 LUKS stanza below is ever enabled, this
###   stops being optional. A non-FIPS install with disk encryption picks Argon2
###   rather than the FIPS-compliant PBKDF2 KDF, and is then "either not
###   compliant or potentially unbootable when switched to FIPS mode after
###   installation" (Security hardening 1.1.1).
###
### BEHAVIOUR CHANGE vs the original file: clearpart was "--linux", which is not
### reliable with an explicit partition scheme. Now "--all --initlabel" plus
### zerombr. This WILL wipe sda on every build.

# Generated by Anaconda 34.25.4.9
# Generated by pykickstart v3.32
#version=RHEL10
text

%addon com_redhat_kdump --enable --reserve-mb='auto'

%end

# Keyboard layouts
keyboard --xlayouts='us'
# System language
lang en_US.UTF-8

# Network information

network  --bootproto=dhcp --device=ens160 --ipv6=auto --activate
%include /tmp/network.ks

# Use network installation
url --url="http://build.totalnetsolutions.net/centos/10/BaseOS/x86_64_v2/os"
repo --name="extras"
# AppStream, verified reachable 2026-09-02 (HTTP 200 on repodata/repomd.xml).
# Required at install time: policycoreutils-python-utils (audit2allow, audit2why,
# semanage) is an AppStream package, and without this line Anaconda halts on an
# interactive "missing packages" prompt, which breaks the unattended build.
# NOTE the Oracle path convention: baseos carries /latest/, appstream does NOT.
# The .../appstream/latest/... form returns 404.
repo --name=appstream --baseurl=http://build.totalnetsolutions.net/centos/10/AppStream/x86_64_v2/os

%packages
@^minimal-environment
@headless-management
autofs
open-vm-tools
epel-release
langpacks-en
wget
python3-packaging
python3-requests
dnf-automatic
nfs-utils
libxcrypt-compat
perl-FindBin
perl-Sys-Hostname
perl-sigtrap

# --- SELinux tooling required by adbridge-selinux-lab-runbook.md --------------
# sections 3, 5, 6 and 7 use semodule, sestatus, getenforce, semanage,
# sesearch and audit2allow. A minimal EL10 install has none of the last three.
# Repo placement in EL10 (verify if the build tree only serves BaseOS):
#   setools-console               BaseOS     -> sesearch, seinfo, sediff
#   libselinux-utils              BaseOS     -> getenforce, setenforce, avcstat
#   policycoreutils               BaseOS     -> semodule, sestatus, restorecon
#   policycoreutils-python-utils  AppStream  -> audit2allow, audit2why, semanage
# audit2allow being AppStream matters: the published AD Bridge SELinux
# remediation procedure depends on it.
setools-console
libselinux-utils
policycoreutils
policycoreutils-python-utils

%end

# Run the Setup Agent on first boot
firstboot --disable


ignoredisk --only-use=sda

# --- STIG partition layout (replaces "autopart") -----------------------------
# reqpart creates whatever the platform demands (BIOS boot partition on GPT, or
# the EFI System Partition on UEFI), so this file works on BIOS and UEFI VMs.
# Ref: RHEL 10 kickstart commands and options reference, "reqpart"
# https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/10/html/automatically_installing_rhel/kickstart-commands-and-options-reference
zerombr
clearpart --all --initlabel
reqpart

# /boot at 2 GiB per the RHEL 10 recommended minimum (raised from 1 GiB in EL9).
# /boot cannot be an LVM volume.
part /boot --fstype=xfs --size=2048 --fsoptions="defaults,nodev,nosuid" --label=boot
part pv.01 --fstype=lvmpv --grow
volgroup vg_os pv.01

logvol swap            --vgname=vg_os --name=lv_swap      --fstype=swap --percent=8
logvol /               --vgname=vg_os --name=lv_root      --fstype=xfs  --percent=30 --fsoptions="defaults"
logvol /home           --vgname=vg_os --name=lv_home      --fstype=xfs  --percent=2  --fsoptions="defaults,nodev,nosuid,noexec"
logvol /tmp            --vgname=vg_os --name=lv_tmp       --fstype=xfs  --percent=9  --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var            --vgname=vg_os --name=lv_var       --fstype=xfs  --percent=18 --fsoptions="defaults,nodev"
logvol /var/log        --vgname=vg_os --name=lv_varlog    --fstype=xfs  --percent=13 --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var/log/audit  --vgname=vg_os --name=lv_varlogaud --fstype=xfs  --percent=13 --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var/tmp        --vgname=vg_os --name=lv_vartmp    --fstype=xfs  --percent=5  --fsoptions="defaults,nodev,nosuid,noexec"

# RHEL-10-000510 / V-280935 (CAT I) at-rest encryption. Enable only with
# Clevis/Tang or TPM2 escrow:
# part pv.01 --fstype=lvmpv --grow --encrypted --luks-version=luks2 --passphrase=CHANGEME

# `bootloader` is a required command in RHEL 10. --boot-drive rather than
# --location keeps this working on both BIOS and UEFI.
#
# --append="fips=1" carries FIPS onto the installed system and into
# GRUB_CMDLINE_LINUX so later kernels inherit it. It does NOT put the installer
# into FIPS mode - that has to come from the PXE/ISO boot line. See the FIPS
# banner at the top of this file. The matching boot=UUID= argument is added in
# %post, once /boot has a UUID to read.
bootloader --boot-drive=sda --append="fips=1"
# -----------------------------------------------------------------------------

timesource --ntp-server=prwndcns01.totalnetsolutions.net
timesource --ntp-server=time-b-g.nist.gov
timesource --ntp-server=clock.xmission.com
# System timezone
timezone America/Chicago --utc

# --- badmin: Password Safe MANAGED account ------------------------------------
# badmin:x:15000:15000:Backup Admin:/home/badmin:/bin/bash
#
# Initial credential: SHA-512 ($6$), matching the OL8/OL9 lab builds so badmin
# has one password across every host. EL10 defaults to yescrypt ($y$) for new
# passwords, but libxcrypt 4.4.x on EL10 still verifies sha512crypt, so a $6$
# hash here is fine. Password Safe rotates badmin at onboarding, using
# pass-reset as the functional account.
#
# NOTE - /home/badmin is on the /home logical volume, which is mounted noexec
# (RHEL-10-400365). A Backup Admin cannot run scripts or binaries out of its own
# home directory. Put anything executable in /opt or /usr/local/bin.
#
# NOTE - if /home is automounted here, the local /home/badmin created at install
# is shadowed once autofs mounts over /home. Verify with `findmnt /home`.
group --name badmin --gid 15000
user --name badmin --uid 15000 --gid 15000 --gecos "Backup Admin" --homedir /home/badmin --shell /bin/bash --iscrypted --password=$6$080GomxHfXlHvhnH$vHnja/fPEOwNWjzjS9BxgyUwJyAOZ96HMLj7VF08KyiqyPvN9XI9GvTpEZu9uBLT15vDHzeFVEDDpf3oA5KhJ1

# --- pass-reset: Password Safe FUNCTIONAL account -----------------------------
# Deliberately homed at /opt/pass-reset, NOT under the automounted (and noexec)
# /home. Password Safe authenticates as this account to rotate badmin.
# local passwordsafe user
group --name sysadmin --gid 10001
user --homedir /opt/pass-reset --name pass-reset --iscrypted --shell /bin/bash --uid 10066 --gecos "PasswordSafe" --password $y$j9T$2lFT6DvvQOLKMicZf/Kx00$wc5wc8WWdXL/A1OlkUCDSeD324JXTsmIX0t0OlIomS0 --groups sysadmin
sshkey --username pass-reset "ssh-rsa  PBPS Root Cert for Linode"
sshkey --username pass-reset "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQC54dkBgC4PhipcbkzC+gCr3GFt2PdVY7N/y8/hFmMCh4MhKQCCjUJZrrbryzqeR0m4xLJIpss/mZZyJDKq1lwfF/vk4Tw/M+jlRplUZaHg9orLq4cRGAp9Qp7g59bsFpwH/wZXb+9JfxZg9hA/DSCTIlhAAPZc+cPIEmAUaR3y1w== rob@l-7k0s2z2"


# Root password
rootpw --iscrypted --allow-ssh $6$ajLe9SmfLY7wsNbz$sKSevm/n/4lUb4Ow.XQ69ljdEfS0pryl/s6r13jKQsnTd3GyzMoK3YDU6kE51SAduxtrR0Qa61V8LnPaNd3wu0

reboot --eject
%pre --log=/tmp/ks-pre.log
#!/bin/sh
SERVERNAME="lblxapxx-template.child1.lwtest.corp"

for x in `cat /proc/cmdline`; do
    case $x in SERVERNAME*)
        eval $x
        ;;
    esac;
done
echo "network --hostname ${SERVERNAME}" > /tmp/network.ks
%end

%post --log=/root/ks-post.log

# =============================================================================
# FIPS - see the banner at the top of this file before changing anything here
# =============================================================================
# `bootloader --append="fips=1"` above put fips=1 on the installed kernel
# command line. A separate /boot additionally requires boot=UUID=<uuid>
# (Security hardening 1.1.2), and that UUID does not exist until now.
#
# grubby rewrites the BLS entries that already exist under /boot/loader/entries;
# GRUB_CMDLINE_LINUX is what new entries are generated from when a later kernel
# is installed. Both are needed - editing only /etc/default/grub leaves the
# current kernel without the argument.
BOOTDEV=$(findmnt -no SOURCE /boot 2>/dev/null)
BOOTUUID=$(blkid -s UUID -o value "$BOOTDEV" 2>/dev/null)
if [ -n "$BOOTUUID" ]; then
  grubby --update-kernel=ALL --args="boot=UUID=$BOOTUUID" || true
  if ! grep -q 'boot=UUID=' /etc/default/grub 2>/dev/null; then
    sed -i "s|^\(GRUB_CMDLINE_LINUX=\"[^\"]*\)\"|\1 boot=UUID=$BOOTUUID\"|" /etc/default/grub
  fi
  echo "FIPS: boot=UUID=$BOOTUUID added for $BOOTDEV"
else
  echo "FIPS WARNING: could not resolve the /boot UUID; boot=UUID= NOT set." >&2
  echo "FIPS WARNING: FIPS integrity checking may fail on a separate /boot." >&2
fi

# Crypto policy. With fips=1 the policy follows to plain FIPS on its own; set the
# AD-SUPPORT subpolicy explicitly so this host matches lblxapxx24, which runs
# FIPS:AD-SUPPORT. The EL10 FIPS crypto-policy overlay
# (/usr/libexec/fips-crypto-policy-overlay, ConditionKernelCommandLine=fips=1)
# bind-mounts over any policy that does not match ^FIPS:, so FIPS:AD-SUPPORT
# survives a reboot and a bare AD-SUPPORT would not.
#
# NOT FIPS:STIG, which is what lblxapxx25 runs: EL10's crypto-policies ships no
# STIG.pmod. The stock modules are AD-SUPPORT, AD-SUPPORT-LEGACY, ECDHE-ONLY,
# NO-ENFORCE-EMS, NO-HMAC-SHA1, NO-PQ, OSPP and TEST-PQ. FIPS:STIG would need a
# hand-written /etc/crypto-policies/policies/modules/STIG.pmod, which is a new
# uncontrolled variable, so this host mirrors 24 instead of 25.
#
# Caveat for whoever reads the comparison: EL10's AD-SUPPORT dropped RC4 and MD5,
# so this is NOT a byte-identical posture to 24's, only the same policy name.
update-crypto-policies --set FIPS:AD-SUPPORT || \
  echo "FIPS WARNING: update-crypto-policies --set FIPS:AD-SUPPORT failed" >&2

# =============================================================================
# STIG filesystem hardening that cannot be expressed as a kickstart partition
# =============================================================================

# --- /dev/shm mount options --------------------------------------------------
#   RHEL-10-700135 / V-281235  nodev
#   RHEL-10-700140 / V-281236  noexec
#   RHEL-10-700145 / V-281237  nosuid
if ! grep -qE '^[^#]*[[:space:]]/dev/shm[[:space:]]' /etc/fstab; then
  echo 'tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0' >> /etc/fstab
fi

# --- /boot/efi nosuid (UEFI systems only) ------------------------------------
#   RHEL-10-700130 / V-281234
if grep -qE '^[^#]*[[:space:]]/boot/efi[[:space:]]' /etc/fstab; then
  sed -i -E '\|[[:space:]]/boot/efi[[:space:]]|{ /nosuid/!s/(vfat[[:space:]]+)([^[:space:]]+)/\1\2,nodev,nosuid/ }' /etc/fstab
fi

# --- RPM temp path (DEFENSIVE, not a STIG requirement) -----------------------
# noexec on /var/tmp does not break normal RPM scriptlets, but it does break
# third-party self-extracting installers. RHEL 10 puts only nodev on /var
# (RHEL-10-700165), so exec remains permitted there.
# Ref: rpm %_tmppath macro - https://rpm-software-management.github.io/rpm/manual/macros.html
mkdir -p /var/rpmtmp
chmod 0700 /var/rpmtmp
mkdir -p /etc/rpm/macros.d
printf '%%_tmppath /var/rpmtmp\n' > /etc/rpm/macros.d/macros.stig-tmppath

# --- first-boot framework: ONE service, many drop-in scripts ------------------
# Ported from phil-hands-off-debian, preseed/classes/setup/first-boot:
#   /usr/local/sbin/custom-first-boot.sh   runner; executes /usr/local/sbin/first-boot.d/*
#   /usr/local/sbin/first-boot.d/          numbered drop-ins, run in glob order
#   /etc/first-boot/                       secrets, deleted once the runner finishes
#
# Why one service and not one per task: a long-running host ends up with a single
# clearly-named unit in `systemctl list-units`, and a single obvious failure if
# anything went wrong at first boot. Adding work means dropping another numbered
# script into first-boot.d, not shipping another unit.
#
# The unit renames the runner to .done via ExecStartPost, so it cannot run twice.
# ExecStartPost only fires when ExecStart succeeded, so a failed drop-in leaves
# the runner in place and the unit failed - visible in `systemctl --failed`, and
# it retries next boot. That is deliberate.
mkdir -p /usr/local/sbin/first-boot.d /etc/first-boot
chmod 0700 /etc/first-boot

cat > /usr/local/sbin/custom-first-boot.sh <<'CFBEOF'
#!/bin/sh
# Runner for /usr/local/sbin/first-boot.d/*.
# Ported from phil-hands-off-debian
# preseed/classes/setup/first-boot/files/custom-first-boot.sh
exitcode=0

for script in /usr/local/sbin/first-boot.d/* ; do
  [ -x "$script" ] || continue
  logger -p local0.info "Running first boot $script"
  if "$script"; then
    logger -p local0.info "first boot OK: $script"
  else
    logger -p local0.error "first boot script FAILED: $script"
    echo "$script" >> /root/first-boot-FAILED.txt
    exitcode=9
  fi
done

# DECISION, stated rather than inherited from a bug: secrets staged for first boot
# are removed whether or not a drop-in failed. Leaving them on a long-running host
# is worse than losing them. The cost is that a secret-dependent drop-in CANNOT be
# retried after a failure - the host has to be rebuilt - so the failure has to be
# loud. Hence the breadcrumb file above and the explicit message below.
#
# NOTE vs the Debian original: it tests `[ $exitcode ]`, which is true for any
# non-empty value including 9, so its warning branch is unreachable and the
# cleanup always ran. Behaviour here is the same (always clean up) but the
# logging is honest. Worth fixing on the Debian side too.
if [ -d /etc/first-boot ]; then
  logger -p local0.info "Deleting data in /etc/first-boot"
  rm -Rf /etc/first-boot
fi
if [ "$exitcode" -ne 0 ]; then
  logger -p local0.warning "one or more first-boot scripts failed - see /root/first-boot-FAILED.txt. /etc/first-boot was deleted regardless, so any secret-dependent script cannot be retried: rebuild the host."
fi

exit $exitcode
CFBEOF
chmod 0700 /usr/local/sbin/custom-first-boot.sh

cat > /etc/systemd/system/custom-first-boot.service <<'CFBUEOF'
[Unit]
Description=Run first boot script
ConditionPathExists=/usr/local/sbin/custom-first-boot.sh
Wants=network-online.target
After=network-online.target
After=sshd.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/custom-first-boot.sh
ExecStartPost=/usr/bin/mv /usr/local/sbin/custom-first-boot.sh /usr/local/sbin/custom-first-boot.done

[Install]
WantedBy=multi-user.target
CFBUEOF

mkdir -p /etc/systemd/system/multi-user.target.wants
ln -sf /etc/systemd/system/custom-first-boot.service \
       /etc/systemd/system/multi-user.target.wants/custom-first-boot.service

# --- drop-in 05: baseline capture --------------------------------------------
# Numbered 05 so it runs BEFORE any AD Bridge install or domain join drop-in.
# Anaconda %post is chrooted into the target but runs under the INSTALLER kernel,
# SELinux state and mount table, so `uname -r`, `sestatus`, `getenforce`, `lsblk`
# and `findmnt` executed there describe the installer, not this host. The whole
# capture therefore happens here, at first boot. Runbook section 3.
cat > /usr/local/sbin/first-boot.d/05-baseline-capture <<'CAPEOF'
#!/bin/sh
# First-boot baseline capture - AD Bridge SELinux lab (CS1495403).
# Runs on the BOOTED system. Cf. docs/adbridge-selinux-lab-runbook.md section 3.
set -u
OUT=/root/baseline-state.txt
{
  echo "=== captured $(date -u +%Y-%m-%dT%H:%M:%SZ) on $(hostname -f 2>/dev/null || hostname) ==="
  echo "=== source: first boot (first-boot.d/05-baseline-capture), NOT anaconda %post ==="
  echo
  echo "--- release / kernel ---"
  cat /etc/os-release 2>/dev/null
  cat /etc/system-release 2>/dev/null
  uname -r
  echo
  echo "--- SELinux ---"
  sestatus
  getenforce
  rpm -q selinux-policy selinux-policy-targeted openscap scap-security-guide
  rpm -q setools-console libselinux-utils policycoreutils policycoreutils-python-utils
  echo
  echo "--- SSSD (runbook section 5: AD Bridge requires SSSD absent) ---"
  rpm -qa | grep -i sssd || echo "no sssd packages"
  systemctl is-enabled sssd 2>/dev/null || true
  systemctl is-active  sssd 2>/dev/null || true
  echo
  echo "--- AD Bridge presence at baseline (expected absent under LABREPRO=1) ---"
  rpm -qa | grep -iE 'pbis|adbridge' || echo "no AD Bridge packages"
  ls -lZ /var/lib/pbis/ 2>/dev/null || echo "/var/lib/pbis absent"
  echo
  echo "--- filesystem layout ---"
  lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT
  findmnt -no TARGET,SOURCE,OPTIONS / /boot /home /tmp /var /var/log /var/log/audit /var/tmp /dev/shm
  echo
  echo "--- STIG mount option check ---"
  for m in /home /tmp /var/log /var/log/audit /var/tmp /dev/shm; do
    o=$(findmnt -no OPTIONS "$m" 2>/dev/null)
    for opt in nodev nosuid noexec; do
      case "$o" in *"$opt"*) : ;; *) echo "FAIL $m missing $opt" ;; esac
    done
  done
  findmnt -no OPTIONS /var  | grep -q nodev  || echo "FAIL /var missing nodev"
  findmnt -no OPTIONS /boot | grep -q nosuid || echo "FAIL /boot missing nosuid"
  echo "(silence above = all mount options present)"
  echo
  echo "--- SELinux tooling ---"
  for b in semodule sestatus getenforce setenforce semanage sesearch seinfo \
           audit2allow audit2why restorecon matchpathcon ausearch; do
    printf '%-14s ' "$b"; command -v "$b" || echo MISSING
  done
} > "$OUT" 2>&1

semodule -l 2>/dev/null | sort > /root/baseline-semodule.txt
cp /etc/fstab /root/baseline-fstab.txt
{ lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT; echo; cat /etc/fstab; } > /root/stig-layout.txt 2>&1

# Re-verify the SELinux tooling on the booted system and flag gaps loudly.
MISSING=""
for b in semodule sestatus getenforce semanage sesearch seinfo audit2allow audit2why; do
  command -v "$b" >/dev/null 2>&1 || MISSING="$MISSING $b"
done
if [ -n "$MISSING" ]; then
  {
    echo "MISSING SELinux tooling:$MISSING"
    echo "audit2allow/audit2why/semanage come from policycoreutils-python-utils (AppStream)."
    echo "sesearch/seinfo come from setools-console (BaseOS)."
  } > /root/SELINUX-TOOLING-MISSING
else
  rm -f /root/SELINUX-TOOLING-MISSING
fi

exit 0
CAPEOF
chmod 0700 /usr/local/sbin/first-boot.d/05-baseline-capture

# --- drop-in 06: FIPS verification -------------------------------------------
# The single thing this build can get silently wrong. Everything the kickstart
# can do for FIPS is done, but fips=1 on the INSTALLER boot line is outside its
# control, and a host that missed it looks configured while reporting
# fips_enabled=0. RHEL 10 cannot be switched to FIPS mode afterwards, so this is
# a rebuild, not a repair - which is exactly why it must be caught on boot 1.
cat > /usr/local/sbin/first-boot.d/06-fips-verify <<'FIPSVEOF'
#!/bin/sh
# Verify this host actually came up in FIPS mode.
fips=`cat /proc/sys/crypto/fips_enabled 2>/dev/null || echo 0`
pol=`update-crypto-policies --show 2>/dev/null`
{
  echo "fips_enabled=$fips"
  echo "crypto_policy=$pol"
  echo "cmdline=`cat /proc/cmdline`"
} > /root/fips-state.txt 2>&1

if [ "$fips" != "1" ]; then
  rm -f /root/FIPS-OK
  {
    echo "This host is NOT in FIPS mode: /proc/sys/crypto/fips_enabled=$fips"
    echo
    echo "The installer was not booted with fips=1. RHEL 10 removed"
    echo "fips-mode-setup and does not support enabling FIPS after installation,"
    echo "so this host CANNOT be corrected in place - it must be rebuilt with"
    echo "fips=1 on the PXE append line or the ISO boot entry."
    echo
    echo "Until then this host is NOT comparable to lblxapxx24."
    echo
    cat /root/fips-state.txt
  } > /root/FIPS-NOT-ENABLED
  echo "ERROR: not in FIPS mode - see /root/FIPS-NOT-ENABLED"
  logger -p local0.error "fips-verify: NOT in FIPS mode (fips_enabled=$fips); installer missed fips=1; host must be rebuilt"
else
  rm -f /root/FIPS-NOT-ENABLED
  : > /root/FIPS-OK
  logger -p local0.info "fips-verify: FIPS mode active, crypto policy '$pol'"
fi

if [ "$pol" != "FIPS:AD-SUPPORT" ]; then
  echo "WARNING: crypto policy is '$pol', expected FIPS:AD-SUPPORT"
  logger -p local0.warning "fips-verify: crypto policy '$pol', expected FIPS:AD-SUPPORT"
fi

# Exit 0 on purpose. A non-zero exit here would fail custom-first-boot.service,
# which stops ExecStartPost renaming the runner to .done - so it would re-run at
# every boot, with /etc/first-boot already deleted, and would re-run the PWS
# onboarding drop-in every time. The marker files and the local0.error above are
# the alarm. Flip this to `exit 1` only if you would rather have a hard failure.
exit 0
FIPSVEOF
chmod 0700 /usr/local/sbin/first-boot.d/06-fips-verify

# SELinux tooling the runbook depends on. Declared in %packages above, but
# policycoreutils-python-utils lives in AppStream - if the build tree only
# serves BaseOS it will have been skipped silently. Install and verify.
dnf -y install setools-console libselinux-utils policycoreutils policycoreutils-python-utils \
  2>&1 | tee -a /root/selinux-tooling.log
MISSING=""
for b in semodule sestatus getenforce setenforce semanage sesearch seinfo audit2allow audit2why restorecon; do
  command -v "$b" >/dev/null 2>&1 || MISSING="$MISSING $b"
done
if [ -n "$MISSING" ]; then
  echo "MISSING SELinux tooling:$MISSING" > /root/SELINUX-TOOLING-MISSING
  echo "audit2allow/audit2why/semanage come from policycoreutils-python-utils (AppStream)." >> /root/SELINUX-TOOLING-MISSING
  echo "sesearch/seinfo come from setools-console (BaseOS)." >> /root/SELINUX-TOOLING-MISSING
  cat /root/SELINUX-TOOLING-MISSING
fi

# =============================================================================
# LAB REPRODUCTION GATE  (runbook sections 3 and 5)
# =============================================================================
# The AD Bridge SELinux lab (CS1495403) requires baseline state to be captured
# BEFORE AD Bridge is installed and BEFORE any STIG remediation, because the
# diff against that baseline is the experimental result. It also requires
# AD Bridge to be installed by hand under enforcing, since whether that install
# is clean is itself Track A evidence.
#
# Boot a lab host with:
#     LABREPRO=1
# on the kernel command line, alongside SERVERNAME=. The AD Bridge install and
# the first-boot domain join wiring are then SKIPPED and the runbook takes over
# from section 3.
#
# Password Safe asset creation and managed-account registration STILL RUN - they
# are independent of AD Bridge, and the morning scan would enrol the host anyway.
#
# Without LABREPRO=1 the build behaves exactly as the original lab auto-build.
LABREPRO=0
for x in `cat /proc/cmdline`; do
    case $x in LABREPRO=*)
        eval $x
        ;;
    esac;
done

if [ "$LABREPRO" = "1" ]; then

  # Baseline state capture does NOT happen here. Anaconda's %post is chrooted
  # into the target but still running under the INSTALLER kernel and the
  # installer's SELinux state and mount table, so `uname -r`, `sestatus`,
  # `lsblk` and `findmnt` would all describe the installer, not this host.
  # It runs at first boot instead, via custom-first-boot.service, which is
  # installed unconditionally further up this %post as first-boot.d/05-baseline-capture.
  # See runbook section 3.
  touch /root/.labrepo-baseline-wanted

  echo "LABREPRO=1: AD Bridge install and first-boot domain join SKIPPED." > /root/LABREPRO-ACTIVE
  echo "Password Safe asset + managed-account registration still ran." >> /root/LABREPRO-ACTIVE
  echo "Continue with docs/adbridge-selinux-lab-runbook.md section 3." >> /root/LABREPRO-ACTIVE
fi

# =============================================================================
# Original lab build steps below
# =============================================================================

#rm /etc/yum.repos.d/*
# disable all existing repos, replace with internal
#sed -i 's/enabled=1/enabled=0/g' /etc/yum.repos.d/*
#yum install -y mosh tmux open-vm-tools libxcrypt-compat python3-packaging wget
yum install -y mosh tmux
wget -O /etc/yum.repos.d/pbise.repo http://build.totalnetsolutions.net/centos/pbis.repo
# custom-first-boot.service is now written inline by the first-boot framework
# above, matching phil-hands-off-debian. The build-server copy is no longer
# fetched, because the two would silently disagree about ExecStart.
# wget -O /etc/systemd/system/custom-first-boot.service http://build.totalnetsolutions.net/centos/pbise/custom-first-boot.service

# set kernel install limit from 5 to 2
sed -i 's/installonly_limit=./installonly_limit=2/g' /etc/yum.conf

# prep homedir FOR creation...
# do these before joining the domain OR before setting up automount, so that Scanning *always* works even if automount fails
cp -R /etc/skel /opt/lab-pass-reset
chown -R 1680737517:1680343553 /opt/lab-pass-reset
cp -R /etc/skel /opt/retina
chown -R 1680766723:1680348260 /opt/retina

mkdir /net
automount
sleep 2

if [ "$LABREPRO" != "1" ]; then
# AD Bridge from the internal repo - no .rpm.sh shell installer, which keeps the
# install off any noexec mount point. Runbook section 5.
#
# NOT pbis-enterprise-fips, which was inherited from anaconda-10.cfg. The
# internal repo tops out at pbis-enterprise-fips-25.1.0-971, while plain
# pbis-enterprise has 26.2.0-1316 - the build the lblxapxx24/25 control pair
# runs. Taking the -fips package would put this host a whole release train away
# from the pair it exists to be compared against, which is a far bigger confound
# than the FIPS build itself. Check the repo before changing this back:
