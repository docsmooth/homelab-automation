### AlmaLinux 10 kickstart - STIG-supported disk layout (MINIMAL variant)
###
### Derived from: anaconda-10.cfg (working Alma 10 lab build)
### Change scope: disk partitioning + fstab mount options, badmin account,
###               SELinux tooling, LABREPRO gate. No OpenSCAP remediation.
###
### BASELINE - READ THIS BEFORE CITING ANYTHING FROM THIS FILE
### There is NO DISA STIG for AlmaLinux 10. DISA publishes an AlmaLinux OS 9 STIG
### (filed under "Cloud Linux", rule prefix ALMA-09-xxxxxx) but nothing for 10.
### AlmaLinux's scap-security-guide package builds its almalinux10 product by
### copying products/rhel10 and sed-rebranding the strings - see
### https://git.almalinux.org/rpms/scap-security-guide/raw/branch/a10/add-almalinux10-support.sh
### So the rules below are cited against the DISA Red Hat Enterprise Linux 10
### STIG V1R2 (published 2026-05-14), which is what that content actually is.
### Do not represent an AlmaLinux 10 scan result as DISA-authoritative.
###   RHEL 10 STIG V1R2: https://cyber.trackr.live/stig/Red_Hat_Enterprise_Linux_10/1/2
###   Verify against:    https://public.cyber.mil/stigs/downloads/
###
### Separate-filesystem rules implemented:
###   RHEL-10-000520 / V-280936  separate FS for the system audit data path (/var/log/audit)
###   RHEL-10-000530 / V-280937  separate FS for user home directories (/home)
###   RHEL-10-000540 / V-280938  separate FS for /tmp
###   RHEL-10-000550 / V-280939  separate FS for /var
###   RHEL-10-000560 / V-280940  separate FS for /var/log
###   RHEL-10-000570 / V-280941  separate FS for /var/tmp
###   NOTE: RHEL 10 has no separate-FS rule for /boot. It is created here because
###         RHEL-10-700120 (nodev) and RHEL-10-700125 (nosuid) on /boot are only
###         enforceable if /boot is its own filesystem.
###
### Mount-option rules implemented:
###   RHEL-10-700120 / V-281232  /boot            nodev
###   RHEL-10-700125 / V-281233  /boot            nosuid
###   RHEL-10-700130 / V-281234  /boot/efi        nosuid   (UEFI only - set in %post)
###   RHEL-10-700135/40/45  V-281235/6/7  /dev/shm  nodev,noexec,nosuid  (%post - tmpfs)
###   RHEL-10-700150/55/60  V-281238/9/40 /tmp      nodev,noexec,nosuid
###   RHEL-10-700165 / V-281241  /var             nodev ONLY - RHEL 10 has no
###                                               noexec or nosuid rule for /var
###   RHEL-10-700170/75/80  V-281242/3/4  /var/log  nodev,noexec,nosuid
###   RHEL-10-400400/05/10  V-281091/2/3  /var/log/audit nodev,noexec,nosuid
###   RHEL-10-700185/90/95  V-281245/6/7  /var/tmp  nodev,noexec,nosuid
###   RHEL-10-400355 / V-281088  /home            nodev
###   RHEL-10-400360 / V-281089  /home            nosuid
###   RHEL-10-400365 / V-281090  /home            noexec
###
### KNOWN, DELIBERATE DEVIATIONS:
###   RHEL-10-000510 / V-280935 (CAT I) - at-rest encryption on local disk
###     partitions. Not implemented: unattended lab rebuild has no passphrase
###     escrow. Commented stanza in the partition block below.
###   Audit storage capacity - see the sizing note in the runbook, section 2.4.
###
### EL10-SPECIFIC NOTES vs the OL8/OL9 files in this folder:
###   - /boot is 2048 MiB, not 1024. RHEL 10 raised the recommended minimum to
###     2 GiB ("If the /boot partition is too small, insufficient disk space can
###     cause future kernel updates to fail"). Ref: RHEL 10 kickstart reference.
###   - `bootloader` is a REQUIRED command in RHEL 10. Added below.
###   - `install` was removed as a kickstart command; this file does not use it.
###   - btrfs was removed as a valid --fstype. xfs remains the default.
###   - There is no installer Security Policy spoke on EL10: `%addon
###     com_redhat_oscap` was REMOVED in RHEL 10. Hardening must be post-install.
###
### BEHAVIOUR CHANGE vs the original file: clearpart was "--linux", which is not
### reliable with an explicit partition scheme. Now "--all --initlabel" plus
### zerombr. This WILL wipe sda on every build.

# Generated by Anaconda 34.25.4.9
# Generated by pykickstart v3.32
#version=RHEL10
text

%addon com_redhat_kdump --enable --reserve-mb='auto'

%end

# Keyboard layouts
keyboard --xlayouts='us'
# System language
lang en_US.UTF-8

# Network information

network  --bootproto=dhcp --device=ens160 --ipv6=auto --activate
%include /tmp/network.ks

# Use network installation
url --url="http://build.totalnetsolutions.net/centos/10/BaseOS/x86_64_v2/os"
repo --name="extras"
# AppStream, verified reachable 2026-09-02 (HTTP 200 on repodata/repomd.xml).
# Required at install time: policycoreutils-python-utils (audit2allow, audit2why,
# semanage) is an AppStream package, and without this line Anaconda halts on an
# interactive "missing packages" prompt, which breaks the unattended build.
# NOTE the Oracle path convention: baseos carries /latest/, appstream does NOT.
# The .../appstream/latest/... form returns 404.
repo --name=appstream --baseurl=http://build.totalnetsolutions.net/centos/10/AppStream/x86_64_v2/os

%packages
@^minimal-environment
@headless-management
autofs
open-vm-tools
epel-release
langpacks-en
wget
python3-packaging
python3-requests
dnf-automatic
nfs-utils
libxcrypt-compat
