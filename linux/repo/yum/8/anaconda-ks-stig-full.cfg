# =============================================================================
# FULL VARIANT ONLY - OpenSCAP DISA STIG remediation
# =============================================================================
# Runs LAST, after the AD Bridge domain join and the Password Safe asset/managed-
# account registration, because STIG remediation changes sshd, PAM, and password
# policy and would otherwise break those steps mid-flight.
#
# Sources:
#   Oracle Linux 8: Using OpenSCAP for Security Compliance
#   https://docs.oracle.com/en/operating-systems/oracle-linux/8/oscap/
#   "Oracle Linux 8 DISA STIG is Now Available" (Oracle Linux blog, Tier 2)
#   https://blogs.oracle.com/linux/oracle-linux-9-disa-stig-is-now-available
#
# CONFIDENCE NOTE: the datastream filename below (ssg-ol8-ds.xml) and the profile
# id (xccdf_org.ssgproject.content_profile_stig) are taken from Oracle's OpenSCAP
# guide and the SSG package layout. Both can change between scap-security-guide
# releases. The script therefore discovers the profile at runtime instead of
# assuming it, and logs what it found. VERIFY with:
#     oscap info /usr/share/xml/scap/ssg/content/ssg-ol8-ds.xml

yum install -y openscap-scanner scap-security-guide

SSG_DS=/usr/share/xml/scap/ssg/content/ssg-ol8-ds.xml
SSG_PROFILE=xccdf_org.ssgproject.content_profile_stig

if [ -f "$SSG_DS" ]; then
  # --fetch-remote-resources is required: the OL datastreams reference a remote
  # OVAL component at linux.oracle.com. Without it the evaluation silently
  # under-evaluates. (runbook section 3.1)
  oscap info "$SSG_DS" > /root/stig-oscap-info.txt 2>&1
  # Prefer an exact 'stig' profile; fall back to the first profile whose id ends in _stig.
  if ! grep -q "$SSG_PROFILE" /root/stig-oscap-info.txt; then
    DISCOVERED=$(grep -oE 'xccdf_org\.ssgproject\.content_profile_[A-Za-z0-9_]*stig[A-Za-z0-9_]*' /root/stig-oscap-info.txt | head -1)
    if [ -n "$DISCOVERED" ]; then SSG_PROFILE="$DISCOVERED"; fi
  fi
  echo "Using profile: $SSG_PROFILE" >> /root/stig-oscap-info.txt

  oscap xccdf eval \
    --remediate \
    --fetch-remote-resources \
    --profile "$SSG_PROFILE" \
    --results /root/stig-oscap-results.xml \
    --report  /root/stig-oscap-report.html \
    "$SSG_DS" >> /root/stig-oscap-run.log 2>&1
  # oscap exits 2 when rules fail; that is expected on a remediation pass.
else
  echo "SSG datastream $SSG_DS not found - STIG remediation SKIPPED" > /root/stig-oscap-run.log
fi

# --- LAB REVERSALS after remediation -----------------------------------------
# The STIG profile sets PermitRootLogin no. That is now HARMLESS and is left in
# place: the Password Safe managed account is badmin, rotated via the pass-reset
# functional account, so nothing in this build needs root over SSH.
# (Previously root was the managed account and this had to be reverted, which
# was a deviation from OL08-00-010550.)

# firewalld is enabled in this variant - open what the lab needs.
firewall-cmd --permanent --add-service=ssh   2>/dev/null || true
firewall-cmd --permanent --add-service=mosh  2>/dev/null || true
firewall-cmd --reload 2>/dev/null || true


