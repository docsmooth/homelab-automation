### Oracle Linux 8 kickstart - STIG-supported disk layout (FULL variant)
###
### Derived from: anaconda-ks.cfg (working OL8 lab build)
###
### ####################################################################
### DO NOT USE THIS FILE FOR THE CS1495403 LAB HOSTS
### (lblxapxx23 / lblxapxx24 / lblxapxx25)
###
### It remediates at install time, which destroys the pre-hardening
### baseline that adbridge-selinux-lab-runbook.md section 2 depends on,
### and there is no way to diff semodule/policy state afterwards.
### Use the MINIMAL variant with LABREPRO=1 for those hosts and let the
### runbook drive remediation (section 3).
###
### This file exists to exercise the build-time-hardening automation and
### as a reference for the Track B customer remediation deliverable.
### The runbook's `oscap xccdf generate fix --fix-type kickstart` route
### (section 3.4) is version-matched to the installed scap-security-guide
### and is the better option if these two ever disagree.
### ####################################################################
###
### Change scope: everything in the MINIMAL variant, PLUS
###                 - firewalld enabled (OL08-00-040100 / V-248834)
###                 - SELinux targeted/enforcing made explicit (OL08-00-010170 / V-248546)
###                 - full DISA STIG remediation via OpenSCAP at the end of %post
###                 - STIG support packages (aide, audit, rsyslog, openscap, SSG)
###
### THIS VARIANT IS UNTESTED IN THIS LAB. OpenSCAP STIG remediation rewrites sshd,
### PAM, password policy, audit rules, and kernel boot arguments. Expect the first
### few builds to break something. Build it alongside the MINIMAL variant, not
### instead of it, until it is proven.
###
### Baseline: DISA Oracle Linux 8 STIG V2R9 (published 2026-05-14)
###   Source (mirror, Tier 3 - verify against https://public.cyber.mil/stigs/downloads/):
###   https://cyber.trackr.live/stig/Oracle_Linux_8/2/9
###
### Separate-filesystem rules implemented:
###   OL08-00-010540 / V-248608  separate FS for /var
###   OL08-00-010541 / V-248609  separate FS for /var/log
###   OL08-00-010542 / V-248610  separate FS for the system audit data path (/var/log/audit)
###   OL08-00-010543 / V-248611  separate FS for /tmp
###   OL08-00-010544 / V-248612  separate FS for /var/tmp
###   OL08-00-010800 / V-248648  separate FS for user home directories (/home)
###   NOTE: neither the OL8 nor OL9 STIG mandates a separate /boot. It is created here
###         because OL08-00-010571 (nosuid on /boot) is only enforceable if /boot is its own FS.
###
### Mount-option rules implemented (see --fsoptions on each logvol/part below):
###   OL08-00-040120/1/2  V-248844/5/6  /dev/shm  nodev,nosuid,noexec   (set in %post - tmpfs)
###   OL08-00-040123/4/5  V-248847/8/9  /tmp      nodev,nosuid,noexec
###   OL08-00-040126/7/8  V-248850/1/2  /var/log  nodev,nosuid,noexec
###   OL08-00-040129/30/31 V-248853/4/5 /var/log/audit nodev,nosuid,noexec
###   OL08-00-040132/3/4  V-248856/7/8  /var/tmp  nodev,nosuid,noexec
###   OL08-00-010570 / V-248616       /home     nosuid
###   OL08-00-010590 / V-248620       /home     noexec ("must not execute binary files")
###   OL08-00-010571 / V-248617       /boot     nosuid  (NA on UEFI systems)
###   OL08-00-010580 / V-248619       nodev on ALL nonroot local partitions -> /var, /boot, /home
###
### KNOWN, DELIBERATE DEVIATIONS (documented, not accidental):
###   OL08-00-010030 / V-248525 (CAT I) - LUKS at-rest encryption on all local partitions.
###     NOT implemented: unattended lab rebuild has nowhere to hold a passphrase.
###     See the --encrypted stanza commented at the bottom of the partition block.
###   OL08-00-030660 / V-248811 - "one week of audit records", advisory ~10 GB for
###     /var/log/audit. At 13% of the VG this is only met on disks >= ~80 GB.
###
### Sizing model: percentage-of-volume-group, so the same file works on any disk size.
###   Total allocated = 98%; 2% left free in the VG for LVM rounding and snapshots.
###   Verified minimum tested disk: 20 GB. See STIG-Partitioning-Lab-Guide.md for the table.

install
cmdline

ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel

# --- STIG partition layout (replaces "autopart --type=lvm") -------------------
# reqpart creates whatever the platform demands (BIOS boot partition on GPT,
# or the EFI System Partition on UEFI) so this file works on BIOS and UEFI VMs.
# Ref: Red Hat Kickstart commands and options reference, "reqpart"
# https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/8/html/system_design_guide/kickstart-commands-and-options-reference_system-design-guide
reqpart

part /boot --fstype=xfs --size=1024 --fsoptions="defaults,nodev,nosuid" --label=boot
part pv.01 --fstype=lvmpv --grow
volgroup vg_os pv.01

# 'defaults' is retained ahead of the STIG options so the fstab line stays
# human-readable and matches the STIG check-text examples.
logvol swap            --vgname=vg_os --name=lv_swap      --fstype=swap --percent=8
logvol /               --vgname=vg_os --name=lv_root      --fstype=xfs  --percent=30 --fsoptions="defaults"
logvol /home           --vgname=vg_os --name=lv_home      --fstype=xfs  --percent=2  --fsoptions="defaults,nodev,nosuid,noexec"
logvol /tmp            --vgname=vg_os --name=lv_tmp       --fstype=xfs  --percent=9  --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var            --vgname=vg_os --name=lv_var       --fstype=xfs  --percent=18 --fsoptions="defaults,nodev"
logvol /var/log        --vgname=vg_os --name=lv_varlog    --fstype=xfs  --percent=13 --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var/log/audit  --vgname=vg_os --name=lv_varlogaud --fstype=xfs  --percent=13 --fsoptions="defaults,nodev,nosuid,noexec"
logvol /var/tmp        --vgname=vg_os --name=lv_vartmp    --fstype=xfs  --percent=5  --fsoptions="defaults,nodev,nosuid,noexec"

# OL08-00-010030 / V-248525 (CAT I) at-rest encryption. Enable only if you have a
# key-escrow story (Clevis/Tang or TPM2). Add --encrypted --luks-version=luks2 to
# the pv.01 line above and supply --passphrase= or use autopart --nohome equivalents.
# part pv.01 --fstype=lvmpv --grow --encrypted --luks-version=luks2 --passphrase=CHANGEME
# -----------------------------------------------------------------------------

bootloader --location=mbr

#repo --name="AppStream" --baseurl="http://archive.kernel.org/centos-vault/8-stream/AppStream/x86_64/os"
url --url="https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/"
# AppStream, verified reachable 2026-09-02 (HTTP 200 on repodata/repomd.xml).
# Required at install time: policycoreutils-python-utils (audit2allow, audit2why,
# semanage) is an AppStream package, and without this line Anaconda halts on an
# interactive "missing packages" prompt, which breaks the unattended build.
# NOTE the Oracle path convention: baseos carries /latest/, appstream does NOT.
# The .../appstream/latest/... form returns 404.
repo --name=appstream --baseurl=https://yum.oracle.com/repo/OracleLinux/OL8/appstream/x86_64/

#keyboard
keyboard --vckeymap=us --xlayouts='us'

lang en_US.UTF-8

timezone America/Chicago --isUtc --ntpservers=ntp.ubuntu.com

skipx

# OL08-00-010170 / V-248546 - SELinux targeted policy enforcing
selinux --enforcing
# STIG: firewalld must be enabled (OL08-00-040100 / V-248834). Original lab value was --disabled.
firewall --enabled --service=ssh
services --enabled=chronyd,sshd,autofs,auditd,firewalld,rsyslog
eula --agreed
firstboot --disabled
reboot

%include /tmp/network.ks


# --- badmin: Password Safe MANAGED account ------------------------------------
# badmin:x:15000:15000:Backup Admin:/home/badmin:/bin/bash
#
# Initial credential: the same hash used for pass-reset in the OL9 kickstart.
# Password Safe rotates badmin at onboarding, using a functional account.
#
# SHA-512 ($6$), which is what the OL8 STIG expects and what OL8's libxcrypt 4.1.x
# supports. Do NOT substitute a yescrypt ($y$) hash here - yescrypt arrived in
# libxcrypt 4.2.0 and OL8 cannot verify it. Regenerate with:
#     python3 -c 'import crypt; print(crypt.crypt("<password>", crypt.METHOD_SHA512))'
#
# NOTE - this is currently the same hash as rootpw. Password Safe rotates badmin
# at onboarding so they diverge immediately, but until then root and badmin share
# a password. Fine for a lab; do not carry it into a customer recommendation.
#
# NOTE - /home/badmin is on the /home logical volume, which is mounted noexec
# (OL08-00-010590 / OL09-00-002072). A Backup Admin cannot run scripts or
# binaries out of its own home directory. Put anything executable in /opt or
# /usr/local/bin. See adbridge-selinux-lab-runbook.md section 2.6.
#
# NOTE - if /home is automounted in this environment, the local /home/badmin
# created here is shadowed once autofs mounts over /home, and badmin's real
# home comes from the automount map. Verify with `findmnt /home` after boot.
group --name badmin --gid 15000
user --name badmin --uid 15000 --gid 15000 --gecos "Backup Admin" --homedir /home/badmin --shell /bin/bash --iscrypted --password=$6$080GomxHfXlHvhnH$vHnja/fPEOwNWjzjS9BxgyUwJyAOZ96HMLj7VF08KyiqyPvN9XI9GvTpEZu9uBLT15vDHzeFVEDDpf3oA5KhJ1

rootpw --iscrypted $6$080GomxHfXlHvhnH$vHnja/fPEOwNWjzjS9BxgyUwJyAOZ96HMLj7VF08KyiqyPvN9XI9GvTpEZu9uBLT15vDHzeFVEDDpf3oA5KhJ1


%packages --ignoremissing
@base
@core
autofs
nfs-utils
python3
libnsl

# --- SELinux tooling required by adbridge-selinux-lab-runbook.md --------------
# sections 3, 5, 6 and 7 use semodule, sestatus, getenforce, semanage,
# sesearch and audit2allow. A minimal install ships none of the last three.
#   setools-console               BaseOS     -> sesearch, seinfo, sediff
#   libselinux-utils              BaseOS     -> getenforce, setenforce, avcstat
#   policycoreutils               BaseOS     -> semodule, sestatus, restorecon
#   policycoreutils-python-utils  AppStream  -> audit2allow, audit2why, semanage
# audit2allow being AppStream matters: the published AD Bridge SELinux
# remediation procedure depends on it.
setools-console
libselinux-utils
policycoreutils
policycoreutils-python-utils
# --- FULL variant: STIG support packages ---
aide
audit
rsyslog
rsyslog-gnutls
openscap-scanner
scap-security-guide
opensc

%end

%addon com_redhat_kdump --disable --reserve-mb='auto'

%end

%pre --log=/tmp/ks-pre.log
#!/bin/sh
netline="network --device ens160 --bootproto dhcp --hostname "
SERVERNAME="centos7-template.child1.lwtest.corp"

for x in `cat /proc/cmdline`; do
    case $x in SERVERNAME*)
        eval $x
        ;;
    esac;
done
echo "${netline}${SERVERNAME}" > /tmp/network.ks
%end

%post --log=/root/ks-post.log

# =============================================================================
# STIG filesystem hardening that cannot be expressed as a kickstart partition
# =============================================================================

# --- /dev/shm mount options --------------------------------------------------
# /dev/shm is a tmpfs mounted by systemd, not a partition, so it needs an
# explicit fstab entry to carry the STIG options.
#   OL08-00-040120 / V-248844  nodev
#   OL08-00-040121 / V-248845  nosuid
#   OL08-00-040122 / V-248846  noexec
# https://cyber.trackr.live/stig/Oracle_Linux_8/2/9/V-248844
if ! grep -qE '^[^#]*[[:space:]]/dev/shm[[:space:]]' /etc/fstab; then
  echo 'tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0' >> /etc/fstab
fi

# --- /boot/efi nosuid (UEFI systems only) ------------------------------------
#   OL08-00-010572 / V-248618  nosuid on /boot/efi
# reqpart creates the ESP without STIG options, so patch it here if present.
if grep -qE '^[^#]*[[:space:]]/boot/efi[[:space:]]' /etc/fstab; then
  sed -i -E '\|[[:space:]]/boot/efi[[:space:]]|{ /nosuid/!s/(vfat[[:space:]]+)([^[:space:]]+)/\1\2,nodev,nosuid/ }' /etc/fstab
fi

# --- RPM temp path (DEFENSIVE, not a STIG requirement) -----------------------
# noexec on /var/tmp does not break normal RPM scriptlets (rpm invokes them via
# /bin/sh, which needs read not exec). It DOES break third-party self-extracting
# installers that chmod +x inside %_tmppath. Redirect to /var, which the OL8 STIG
# only requires nodev on - exec remains permitted there.
# Ref: rpm %_tmppath macro - https://rpm-software-management.github.io/rpm/manual/macros.html
mkdir -p /var/rpmtmp
chmod 0700 /var/rpmtmp
mkdir -p /etc/rpm/macros.d
printf '%%_tmppath /var/rpmtmp\n' > /etc/rpm/macros.d/macros.stig-tmppath

# --- autofs / /home interaction ----------------------------------------------
# The lab automounts under /net and AD Bridge lands home dirs under /home/<DOMAIN>.
# The local /home LV above satisfies OL08-00-010800. If you later add an auto.master
# map that mounts ON /home itself, the local LV is shadowed and the STIG /home
# option checks will read the AUTOFS mount instead - in that case the nodev,nosuid,
# noexec options must be added to the autofs map entry, not to fstab.
# See STIG-Partitioning-Lab-Guide.md, section "autofs and /home".

# =============================================================================
# Original lab build steps below - unchanged except where noted
# =============================================================================

# disable all existing repos, replace with internal
# set kernel install limit from 5 to 2
sed -i 's/installonly_limit=./installonly_limit=2/g' /etc/yum.conf


# prep homedir FOR creation...
# do these before joining the domain OR before setting up automount, so that Scanning *always* works even if automount fails
cp -R /etc/skel /opt/lab-pass-reset
chown -R 1680737517:1680343553 /opt/lab-pass-reset
mkdir -p /home/CHILD1
cp -R /etc/skel /home/CHILD1/retina
chown -R 1680766723:1680348260 /home/CHILD1/retina

# install EPEL, then upgrade to latest everything before booting
mkdir /net
automount
sleep 2
wget -O /etc/yum.repos.d/pbise.repo http://build.totalnetsolutions.net/centos/pbis.repo
wget -O /root/epel-release-latest-8.noarch.rpm http://build.totalnetsolutions.net/centos/epel-release-latest-8.noarch.rpm
yum clean all
yum -y upgrade

# --- first-boot framework: ONE service, many drop-in scripts ------------------
# Ported from phil-hands-off-debian, preseed/classes/setup/first-boot:
#   /usr/local/sbin/custom-first-boot.sh   runner; executes /usr/local/sbin/first-boot.d/*
#   /usr/local/sbin/first-boot.d/          numbered drop-ins, run in glob order
#   /etc/first-boot/                       secrets, deleted once the runner finishes
#
# Why one service and not one per task: a long-running host ends up with a single
# clearly-named unit in `systemctl list-units`, and a single obvious failure if
# anything went wrong at first boot. Adding work means dropping another numbered
# script into first-boot.d, not shipping another unit.
#
# The unit renames the runner to .done via ExecStartPost, so it cannot run twice.
# ExecStartPost only fires when ExecStart succeeded, so a failed drop-in leaves
# the runner in place and the unit failed - visible in `systemctl --failed`, and
# it retries next boot. That is deliberate.
mkdir -p /usr/local/sbin/first-boot.d /etc/first-boot
chmod 0700 /etc/first-boot

cat > /usr/local/sbin/custom-first-boot.sh <<'CFBEOF'
#!/bin/sh
# Runner for /usr/local/sbin/first-boot.d/*.
# Ported from phil-hands-off-debian
# preseed/classes/setup/first-boot/files/custom-first-boot.sh
exitcode=0

for script in /usr/local/sbin/first-boot.d/* ; do
  [ -x "$script" ] || continue
  logger -p local0.info "Running first boot $script"
  if "$script"; then
    logger -p local0.info "first boot OK: $script"
  else
    logger -p local0.error "first boot script FAILED: $script"
    exitcode=9
  fi
done

# Secrets staged for first boot are removed whether or not a drop-in failed.
# Leaving them on disk after a partial run is worse than losing them; rebuild
# the host if a secret-dependent script needs another attempt.
#
# NOTE vs the Debian original: it tests `[ $exitcode ]`, which is true for any
# non-empty value including 9, so its warning branch is unreachable and the
# cleanup always ran. Behaviour here is the same (always clean up) but the
# logging is honest. Worth fixing on the Debian side too.
if [ -d /etc/first-boot ]; then
  logger -p local0.info "Deleting data in /etc/first-boot"
  rm -Rf /etc/first-boot
fi
[ "$exitcode" -eq 0 ] || logger -p local0.warning "one or more first-boot scripts failed"

exit $exitcode
CFBEOF
chmod 0700 /usr/local/sbin/custom-first-boot.sh

cat > /etc/systemd/system/custom-first-boot.service <<'CFBUEOF'
[Unit]
Description=Run first boot script
ConditionPathExists=/usr/local/sbin/custom-first-boot.sh
Wants=network-online.target
After=network-online.target
After=sshd.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/custom-first-boot.sh
ExecStartPost=/usr/bin/mv /usr/local/sbin/custom-first-boot.sh /usr/local/sbin/custom-first-boot.done

[Install]
WantedBy=multi-user.target
CFBUEOF

mkdir -p /etc/systemd/system/multi-user.target.wants
ln -sf /etc/systemd/system/custom-first-boot.service \
       /etc/systemd/system/multi-user.target.wants/custom-first-boot.service

# --- drop-in 05: baseline capture --------------------------------------------
# Numbered 05 so it runs BEFORE any AD Bridge install or domain join drop-in.
# Anaconda %post is chrooted into the target but runs under the INSTALLER kernel,
# SELinux state and mount table, so `uname -r`, `sestatus`, `getenforce`, `lsblk`
# and `findmnt` executed there describe the installer, not this host. The whole
# capture therefore happens here, at first boot. Runbook section 3.
cat > /usr/local/sbin/first-boot.d/05-baseline-capture <<'CAPEOF'
#!/bin/sh
# First-boot baseline capture - AD Bridge SELinux lab (CS1495403).
# Runs on the BOOTED system. Cf. docs/adbridge-selinux-lab-runbook.md section 3.
set -u
OUT=/root/baseline-state.txt
{
  echo "=== captured $(date -u +%Y-%m-%dT%H:%M:%SZ) on $(hostname -f 2>/dev/null || hostname) ==="
  echo "=== source: first boot (first-boot.d/05-baseline-capture), NOT anaconda %post ==="
  echo
  echo "--- release / kernel ---"
  cat /etc/os-release 2>/dev/null
  cat /etc/system-release 2>/dev/null
  uname -r
  echo
  echo "--- SELinux ---"
  sestatus
  getenforce
  rpm -q selinux-policy selinux-policy-targeted openscap scap-security-guide
  rpm -q setools-console libselinux-utils policycoreutils policycoreutils-python-utils
  echo
  echo "--- SSSD (runbook section 5: AD Bridge requires SSSD absent) ---"
  rpm -qa | grep -i sssd || echo "no sssd packages"
  systemctl is-enabled sssd 2>/dev/null || true
  systemctl is-active  sssd 2>/dev/null || true
  echo
  echo "--- AD Bridge presence at baseline (expected absent under LABREPRO=1) ---"
  rpm -qa | grep -iE 'pbis|adbridge' || echo "no AD Bridge packages"
  ls -lZ /var/lib/pbis/ 2>/dev/null || echo "/var/lib/pbis absent"
  echo
  echo "--- filesystem layout ---"
  lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT
  findmnt -no TARGET,SOURCE,OPTIONS / /boot /home /tmp /var /var/log /var/log/audit /var/tmp /dev/shm
  echo
  echo "--- STIG mount option check ---"
  for m in /home /tmp /var/log /var/log/audit /var/tmp /dev/shm; do
    o=$(findmnt -no OPTIONS "$m" 2>/dev/null)
    for opt in nodev nosuid noexec; do
      case "$o" in *"$opt"*) : ;; *) echo "FAIL $m missing $opt" ;; esac
    done
  done
  findmnt -no OPTIONS /var  | grep -q nodev  || echo "FAIL /var missing nodev"
  findmnt -no OPTIONS /boot | grep -q nosuid || echo "FAIL /boot missing nosuid"
  echo "(silence above = all mount options present)"
  echo
  echo "--- SELinux tooling ---"
  for b in semodule sestatus getenforce setenforce semanage sesearch seinfo \
           audit2allow audit2why restorecon matchpathcon ausearch; do
    printf '%-14s ' "$b"; command -v "$b" || echo MISSING
  done
} > "$OUT" 2>&1

semodule -l 2>/dev/null | sort > /root/baseline-semodule.txt
cp /etc/fstab /root/baseline-fstab.txt
{ lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT; echo; cat /etc/fstab; } > /root/stig-layout.txt 2>&1

# Re-verify the SELinux tooling on the booted system and flag gaps loudly.
MISSING=""
for b in semodule sestatus getenforce semanage sesearch seinfo audit2allow audit2why; do
  command -v "$b" >/dev/null 2>&1 || MISSING="$MISSING $b"
done
if [ -n "$MISSING" ]; then
  {
    echo "MISSING SELinux tooling:$MISSING"
    echo "audit2allow/audit2why/semanage come from policycoreutils-python-utils (AppStream)."
    echo "sesearch/seinfo come from setools-console (BaseOS)."
  } > /root/SELINUX-TOOLING-MISSING
else
  rm -f /root/SELINUX-TOOLING-MISSING
fi

exit 0
CAPEOF
chmod 0700 /usr/local/sbin/first-boot.d/05-baseline-capture

# --- SELinux tooling (runbook sections 3, 5, 6, 7) ---------------------------
# Runs on EVERY build, not just LABREPRO=1, and runs here rather than in
# %packages because policycoreutils-python-utils is in AppStream while the
# install tree serves BaseOS only. Listing it in %packages makes Anaconda stop
# and ask 'missing packages: policycoreutils-python-utils ... ignore?', which
# defeats an unattended build. By %post the release RPM's full repo set is
# configured, so dnf/yum can reach AppStream.
# audit2allow, audit2why and semanage come from that package, and the published
# AD Bridge SELinux remediation procedure depends on audit2allow.
yum -y install setools-console libselinux-utils policycoreutils policycoreutils-python-utils \
  2>&1 | tee -a /root/selinux-tooling.log
MISSING=""
for b in semodule sestatus getenforce setenforce semanage sesearch seinfo audit2allow audit2why restorecon; do
  command -v "$b" >/dev/null 2>&1 || MISSING="$MISSING $b"
done
if [ -n "$MISSING" ]; then
  echo "MISSING SELinux tooling:$MISSING" > /root/SELINUX-TOOLING-MISSING
  echo "audit2allow/audit2why/semanage come from policycoreutils-python-utils (AppStream)." >> /root/SELINUX-TOOLING-MISSING
  echo "sesearch/seinfo come from setools-console (BaseOS)." >> /root/SELINUX-TOOLING-MISSING
  cat /root/SELINUX-TOOLING-MISSING
fi

# =============================================================================
# LAB REPRODUCTION GATE  (runbook sections 3 and 5)
# =============================================================================
# The AD Bridge SELinux lab (CS1495403) requires baseline state to be captured
# BEFORE AD Bridge is installed and BEFORE any STIG remediation, because the
# diff against that baseline is the experimental result. It also requires
# AD Bridge to be installed by hand under enforcing, since whether that install
# is clean is itself Track A evidence.
#
# Boot the three lab hosts (lblxapxx23 / lblxapxx24 / lblxapxx25) with:
#     LABREPRO=1
# on the kernel command line, alongside SERVERNAME=. The AD Bridge install and
# the domain join are then SKIPPED and the runbook takes over from section 3.
#
# Password Safe asset creation and managed-account registration STILL RUN - they
# are independent of AD Bridge, and the morning scan would enrol the host anyway.
#
# Without LABREPRO=1 the build behaves exactly as the original lab auto-build.
LABREPRO=0
for x in `cat /proc/cmdline`; do
    case $x in LABREPRO=*)
        eval $x
        ;;
    esac;
done

if [ "$LABREPRO" = "1" ]; then

  # Baseline state capture does NOT happen here. Anaconda's %post is chrooted
  # into the target but still running under the INSTALLER kernel and the
  # installer's SELinux state and mount table, so `uname -r`, `sestatus`,
  # `lsblk` and `findmnt` would all describe the installer, not this host.
  # It runs at first boot instead, via custom-first-boot.service, which is
  # installed unconditionally further up this %post as first-boot.d/05-baseline-capture.
  # See runbook section 3.
  touch /root/.labrepo-baseline-wanted

  echo "LABREPRO=1: AD Bridge install and domain join SKIPPED." > /root/LABREPRO-ACTIVE
  echo "Password Safe asset + managed-account registration still ran." >> /root/LABREPRO-ACTIVE
