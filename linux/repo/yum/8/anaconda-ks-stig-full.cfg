python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net  -t asset -a create --workgroup 6 --system `hostname` --macaddress 17:15:AB:AD:1D:EA --ipaddress $ipaddress --dnsname `hostname -f` --operatingsystem "CentOS-Stream 8"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname` --workgroup BEYONDTRUST --attribute "Linux" --attributetype "OS Type"
python3 /root/pbpsapi.py -k $APIKEY -u $APIUSER -C /etc/ssl/certs/ca-bundle.trust.crt -s pbps.totalnetsolutions.net -t attribute -a addToAsset --system `hostname` --workgroup BEYONDTRUST --attribute "Unix" --attributetype "System Class"
